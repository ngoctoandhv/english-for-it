# Nightly encrypted logical backup of the production database, kept as a GitHub Actions artifact for 14 days.
# Secrets: DATABASE_URL (Neon connection string) and BACKUP_PASSPHRASE. Restore steps are in docs/deployment.md.
# The dump holds personal data (emails, progress). Use this only in a PRIVATE repository, and keep the passphrase elsewhere too.
name: backup
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DATABASE_URL" && test -n "$BACKUP_PASSPHRASE" || { echo "DATABASE_URL or BACKUP_PASSPHRASE not set; skipping"; exit 0; }
          pg_dump --format=custom --no-owner "$DATABASE_URL" | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o backup.dump.gpg
          ls -l backup.dump.gpg
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('backup.dump.gpg') != '' }}
        with:
          name: db-backup
          path: backup.dump.gpg
          retention-days: 14
