name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
      - name: Throwaway Web Push keys for the reminder tests
        run: |
          sed -i '/^VAPID_PUBLIC_KEY=$/d; /^VAPID_PRIVATE_KEY=$/d' .env
          docker compose run --rm --no-deps api bin/rails push:keys | grep '^VAPID_' >> .env
          grep -c '^VAPID_P' .env
      - name: Run all checks (rspec, rubocop, brakeman, bundler-audit, tsc, eslint, vitest, next build)
        run: bin/check --build
      - name: End-to-end tests
        run: |
          set -o pipefail
          report() { msg=$(tail -30 "$1" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$2::$msg"; }
          docker compose up -d 2>&1 | tee up.log || { report up.log "docker compose up"; exit 1; }
          for i in $(seq 1 60); do curl -fsS http://localhost:3100/up >/dev/null 2>&1 && break; sleep 2; done
          docker compose exec -T api bin/rails db:seed 2>&1 | tee seed.log || { report seed.log "db:seed"; exit 1; }
          curl -fsS -o /dev/null http://localhost:3101/ || true
          bin/e2e 2>&1 | tee e2e.log || { report e2e.log "playwright"; docker compose logs --tail 40 web api > stack.log 2>&1; report stack.log "web and api logs"; exit 1; }
