# Single-host production example. Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in front
# of `api` (3000) and `web` (3000). Secrets come from .env.production (see .env.production.example), never from git.
name: english-for-it-prod

x-api: &api
  build: { context: ., dockerfile: docker/api.prod.Dockerfile }
  env_file: .env.production
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/english_for_it_production
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: english_for_it_production
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  api:
    <<: *api
  sidekiq:
    <<: *api
    command: bundle exec sidekiq -C config/sidekiq.yml
    healthcheck: { disable: true }
  web:
    build:
      context: .
      dockerfile: docker/web.prod.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}" }
    restart: unless-stopped
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
