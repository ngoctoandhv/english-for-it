name: english-for-it

x-api: &api
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./api:/rails
    - bundle:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "${API_PORT:-3100}:3000"

  sidekiq:
    <<: *api
    command: bundle exec sidekiq -C config/sidekiq.yml

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    command: npm run dev -- -H 0.0.0.0 -p 3000
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "${WEB_PORT:-3101}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  bundle:
  web_node_modules:
  web_next:
