  - { t: weekend, pos: noun, ipa: "/ˈwiːkend/", vi: "cuối tuần", def: "Saturday and Sunday, when many people do not work.", cat: small-talk, ex: ["Did you do anything fun at the weekend?", "Cuối tuần bạn có làm gì vui không?"], col: ["have a nice weekend", "over the weekend"] }
