  - { t: on the other hand, pos: phrase, ipa: "/ɑːn ði ˈʌðər hænd/", vi: "mặt khác", def: "Used to give a different side of an argument.", cat: opinions, ex: ["It is fast. On the other hand, it is expensive.", "Nó nhanh. Mặt khác, nó đắt."], col: ["on the one hand"] }
  - { t: suggest, pos: verb, ipa: "/səˈdʒest/", vi: "gợi ý, đề nghị", def: "To give an idea for someone to think about.", cat: opinions, ex: ["I suggest we meet after lunch.", "Tôi đề nghị chúng ta gặp sau bữa trưa."], col: ["suggest a solution", "may I suggest"] }
  - { t: prefer, pos: verb, ipa: "/prɪˈfɜːr/", vi: "thích hơn", def: "To like one thing more than another.", cat: opinions, ex: ["I prefer the second design.", "Tôi thích thiết kế thứ hai hơn."], col: ["prefer to", "would prefer"] }
  # Time & plans
  - { t: running late, pos: phrase, ipa: "/ˌrʌnɪŋ ˈleɪt/", vi: "đang bị trễ", def: "Later than planned because of a delay.", cat: time-plans, ex: ["Sorry, I am running late. I will be there in ten minutes.", "Xin lỗi, tôi đang bị trễ. Mười phút nữa tôi đến."], col: ["running a bit late"] }
  - { t: reschedule, pos: verb, ipa: "/ˌriːˈskedʒuːl/", vi: "dời lịch", def: "To change the time or date of a planned event.", cat: time-plans, ex: ["Can we reschedule the call to Thursday?", "Chúng ta dời cuộc gọi sang thứ Năm được không?"], col: ["reschedule a meeting"] }
