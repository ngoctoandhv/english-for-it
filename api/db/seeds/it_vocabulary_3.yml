  - { t: later, pos: adverb, ipa: "/ˈleɪtər/", vi: "sau, lát nữa", def: "At a time after now.", cat: time-plans, ex: ["I will call you back later.", "Lát nữa tôi gọi lại cho bạn."], col: ["see you later", "later today"] }
  # Feelings & reactions
