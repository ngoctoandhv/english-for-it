  # Clarifying & checking
  - { t: could you repeat that, pos: phrase, ipa: "/ˌkʊd juː rɪˈpiːt ðæt/", vi: "bạn nhắc lại được không", def: "A polite way to ask someone to say something again.", cat: clarifying, ex: ["Sorry, could you repeat that more slowly?", "Xin lỗi, bạn nhắc lại chậm hơn được không?"], col: ["could you say that again"] }
  - { t: I did not catch that, pos: phrase, ipa: "/aɪ ˌdɪdnt ˈkætʃ ðæt/", vi: "tôi chưa nghe rõ", def: "Used when you did not hear or understand what someone said.", cat: clarifying, ex: ["Sorry, I did not catch that. What was the last part?", "Xin lỗi, tôi chưa nghe rõ. Phần cuối là gì vậy?"], col: ["didn't catch your name"] }
  - { t: what do you mean by, pos: phrase, ipa: "/ˌwɑːt də juː ˈmiːn baɪ/", vi: "ý bạn là gì khi nói", def: "Used to ask someone to explain a word or an idea.", cat: clarifying, ex: ["What do you mean by a quick fix?", "Ý bạn là gì khi nói sửa nhanh?"], col: ["what do you mean"] }
  - { t: just to confirm, pos: phrase, ipa: "/ˌdʒʌst tə kənˈfɜːrm/", vi: "để xác nhận lại", def: "Used before you check that you understood correctly.", cat: clarifying, ex: ["Just to confirm, the release is on Friday?", "Để xác nhận lại, đợt phát hành là thứ Sáu đúng không?"], col: ["just to clarify"] }
  - { t: in other words, pos: phrase, ipa: "/ɪn ˈʌðər wɜːrdz/", vi: "nói cách khác", def: "Used to say something again in a simpler or clearer way.", cat: clarifying, ex: ["In other words, we need two more days.", "Nói cách khác, chúng ta cần thêm hai ngày."], col: ["put another way"] }
  - { t: does that make sense, pos: phrase, ipa: "/dəz ðæt ˌmeɪk ˈsens/", vi: "như vậy có dễ hiểu không", def: "Used to check that the other person understood you.", cat: clarifying, ex: ["I will fix it first and then test it. Does that make sense?", "Tôi sẽ sửa trước rồi test. Như vậy có dễ hiểu không?"], col: ["does that sound OK"] }
  - { t: spell, pos: verb, ipa: "/spel/", vi: "đánh vần", def: "To say or write the letters of a word in order.", cat: clarifying, ex: ["Could you spell your last name, please?", "Bạn đánh vần họ của mình được không?"], col: ["spell a name", "how do you spell"] }
  - { t: slowly, pos: adverb, ipa: "/ˈsloʊli/", vi: "chậm rãi", def: "At a low speed; not fast.", cat: clarifying, ex: ["Could you speak a bit more slowly?", "Bạn nói chậm hơn một chút được không?"], col: ["speak slowly"] }
  - { t: example, pos: noun, ipa: "/ɪɡˈzæmpəl/", vi: "ví dụ", def: "Something that shows what you mean.", cat: clarifying, ex: ["Can you give me an example?", "Bạn cho tôi một ví dụ được không?"], col: ["for example", "give an example"] }
  - { t: understand, pos: verb, ipa: "/ˌʌndərˈstænd/", vi: "hiểu", def: "To know what something means.", cat: clarifying, ex: ["I understand the problem now.", "Giờ tôi đã hiểu vấn đề."], col: ["fully understand", "if I understand correctly"] }
  - { t: let me check, pos: phrase, ipa: "/ˌlet mi ˈtʃek/", vi: "để tôi kiểm tra", def: "Used when you need a moment to look for information.", cat: clarifying, ex: ["Let me check and get back to you.", "Để tôi kiểm tra rồi báo lại bạn."], col: ["let me check my calendar"] }
  - { t: get back to you, pos: phrase, ipa: "/ˌɡet ˈbæk tə juː/", vi: "phản hồi lại bạn sau", def: "To reply to someone later, when you have the answer.", cat: clarifying, ex: ["I will get back to you by tomorrow.", "Tôi sẽ phản hồi bạn trước ngày mai."], col: ["get back to someone"] }

