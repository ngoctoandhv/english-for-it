  - { t: that makes sense, pos: phrase, ipa: "/ðæt ˌmeɪks ˈsens/", vi: "nghe hợp lý", def: "Used to say that you understand and the idea seems reasonable.", cat: opinions, ex: ["OK, that makes sense. Let's do it.", "Ừ, nghe hợp lý đấy. Làm thôi."], col: ["makes sense to me"] }
  - { t: I see your point, pos: phrase, ipa: "/aɪ ˌsiː jʊər ˈpɔɪnt/", vi: "tôi hiểu ý bạn", def: "Used to show you understand someone's view, often before you add your own.", cat: opinions, ex: ["I see your point, but the cost is high.", "Tôi hiểu ý bạn, nhưng chi phí cao quá."], col: ["I see what you mean"] }
  - { t: to be honest, pos: phrase, ipa: "/tə bi ˈɑːnɪst/", vi: "thành thật mà nói", def: "Used before you say what you really think.", cat: opinions, ex: ["To be honest, I am not sure it will work.", "Thành thật mà nói, tôi không chắc nó sẽ chạy được."], col: ["to be completely honest"] }
  - { t: exactly, pos: adverb, ipa: "/ɪɡˈzæktli/", vi: "chính xác", def: "Used to agree strongly with what someone said.", cat: opinions, ex: ["Exactly, that is what I meant.", "Chính xác, đó là ý tôi."], col: ["not exactly"] }
