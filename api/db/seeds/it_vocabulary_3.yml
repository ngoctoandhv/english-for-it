  - { t: tired, pos: adjective, ipa: "/ˈtaɪərd/", vi: "mệt", def: "Needing rest or sleep.", cat: feelings, ex: ["I am tired after the long release.", "Tôi mệt sau đợt phát hành dài."], col: ["tired of", "a bit tired"] }
  - { t: proud, pos: adjective, ipa: "/praʊd/", vi: "tự hào", def: "Pleased about something good that you or others did.", cat: feelings, ex: ["I am proud of what the team built.", "Tôi tự hào về những gì cả nhóm đã làm."], col: ["proud of"] }
  - { t: sorry to hear that, pos: phrase, ipa: "/ˌsɑːri tə ˈhɪr ðæt/", vi: "tiếc khi nghe vậy", def: "A kind reply when someone tells you bad news.", cat: feelings, ex: ["You were sick? Sorry to hear that.", "Bạn bị ốm à? Tiếc quá."], col: ["so sorry to hear that"] }
  - { t: that sounds great, pos: phrase, ipa: "/ðæt ˌsaʊndz ˈɡreɪt/", vi: "nghe tuyệt đấy", def: "A friendly reply to good news or a good idea.", cat: feelings, ex: ["A team lunch on Friday? That sounds great.", "Ăn trưa cả nhóm vào thứ Sáu à? Nghe tuyệt đấy."], col: ["sounds good"] }
  - { t: surprised, pos: adjective, ipa: "/sərˈpraɪzd/", vi: "ngạc nhiên", def: "Feeling something unexpected has happened.", cat: feelings, ex: ["I was surprised that the tests passed.", "Tôi ngạc nhiên vì test lại qua."], col: ["surprised by", "pleasantly surprised"] }
  # Calls & video meetings
  - { t: mute, pos: verb, ipa: "/mjuːt/", vi: "tắt tiếng (micro)", def: "To turn off the sound of your microphone.", cat: calls-video, ex: ["Please mute yourself when you are not speaking.", "Hãy tắt micro khi bạn không nói."], col: ["mute your mic", "on mute"] }
