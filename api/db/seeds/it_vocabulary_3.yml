  - { t: on time, pos: phrase, ipa: "/ɑːn ˈtaɪm/", vi: "đúng giờ", def: "At the planned time, not late.", cat: time-plans, ex: ["The train arrived on time.", "Tàu đến đúng giờ."], col: ["deliver on time", "right on time"] }
  - { t: in advance, pos: phrase, ipa: "/ɪn ədˈvæns/", vi: "trước (thời hạn)", def: "Before a particular time or event.", cat: time-plans, ex: ["Please book the room in advance.", "Vui lòng đặt phòng trước."], col: ["two days in advance"] }
  - { t: as soon as possible, pos: phrase, ipa: "/əz ˌsuːn əz ˈpɑːsəbəl/", vi: "càng sớm càng tốt", def: "Very quickly; written ASAP.", cat: time-plans, ex: ["Please reply as soon as possible.", "Vui lòng trả lời càng sớm càng tốt."], col: ["ASAP"] }
  - { t: free, pos: adjective, ipa: "/friː/", vi: "rảnh", def: "Not busy; having time for something.", cat: time-plans, ex: ["Are you free on Monday afternoon?", "Chiều thứ Hai bạn có rảnh không?"], col: ["free time", "feel free"] }
  - { t: book, pos: verb, ipa: "/bʊk/", vi: "đặt (chỗ, phòng)", def: "To arrange to have a room, a seat or a ticket.", cat: time-plans, ex: ["I booked a meeting room for ten o'clock.", "Tôi đã đặt phòng họp lúc mười giờ."], col: ["book a room", "book a ticket"] }
  - { t: day off, pos: noun, ipa: "/ˌdeɪ ˈɔːf/", vi: "ngày nghỉ", def: "A day when you do not go to work.", cat: time-plans, ex: ["I am taking a day off on Friday.", "Thứ Sáu tôi xin nghỉ một ngày."], col: ["take a day off"] }
