  # Polite requests
  - { t: could you, pos: phrase, ipa: "/ˈkʊd juː/", vi: "bạn có thể ... không (lịch sự)", def: "A polite way to start a request.", cat: polite-requests, ex: ["Could you send me the file, please?", "Bạn có thể gửi tôi tệp đó được không?"], col: ["could you please"] }
  - { t: would you mind, pos: phrase, ipa: "/wʊd juː ˈmaɪnd/", vi: "bạn có phiền ... không", def: "A very polite way to ask someone to do something. It is followed by a verb with -ing.", cat: polite-requests, ex: ["Would you mind checking my pull request?", "Bạn có phiền xem giúp pull request của tôi không?"], col: ["would you mind if I"] }
  - { t: I was wondering if, pos: phrase, ipa: "/aɪ wəz ˈwʌndərɪŋ ɪf/", vi: "tôi đang băn khoăn liệu (mở đầu nhờ vả lịch sự)", def: "A soft, polite way to ask for something.", cat: polite-requests, ex: ["I was wondering if you could help me with this bug.", "Không biết bạn có thể giúp tôi lỗi này không."], col: ["I was wondering whether"] }
  - { t: do you have a minute, pos: phrase, ipa: "/duː juː hæv ə ˈmɪnɪt/", vi: "bạn có rảnh một chút không", def: "A polite way to ask if someone has time to talk now.", cat: polite-requests, ex: ["Do you have a minute to talk about the release?", "Bạn có rảnh một chút để nói về đợt phát hành không?"], col: ["have a minute"] }
  - { t: give me a hand, pos: phrase, ipa: "/ˌɡɪv mi ə ˈhænd/", vi: "giúp tôi một tay", def: "An informal way to ask someone to help you.", cat: polite-requests, ex: ["Can you give me a hand with the slides?", "Bạn giúp tôi một tay làm slide được không?"], col: ["give someone a hand"] }
  - { t: let me know, pos: phrase, ipa: "/ˌlet mi ˈnoʊ/", vi: "cho tôi biết nhé", def: "Used to ask someone to tell you something later.", cat: polite-requests, ex: ["Let me know if you have any questions.", "Nếu có câu hỏi gì thì cho tôi biết nhé."], col: ["let me know when", "let me know if"] }
  - { t: thanks in advance, pos: phrase, ipa: "/ˌθæŋks ɪn ədˈvæns/", vi: "cảm ơn trước", def: "Used at the end of a request to thank someone before they help.", cat: polite-requests, ex: ["Please review it by Friday. Thanks in advance!", "Vui lòng xem trước thứ Sáu. Cảm ơn trước nhé!"], col: ["thanks in advance for your help"] }
  - { t: no worries, pos: phrase, ipa: "/ˌnoʊ ˈwɜːriz/", vi: "không sao đâu", def: "A friendly answer to thanks or to an apology.", cat: polite-requests, ex: ["No worries, I can wait until tomorrow.", "Không sao đâu, tôi có thể đợi đến mai."], col: ["no worries at all"] }
  - { t: favor, pos: noun, ipa: "/ˈfeɪvər/", vi: "việc nhờ vả, ân huệ", def: "Something you do to help someone. British spelling: favour.", cat: polite-requests, ex: ["Can I ask you a favor?", "Tôi nhờ bạn một việc được không?"], col: ["ask a favor", "do someone a favor"] }
  - { t: of course, pos: phrase, ipa: "/əv ˈkɔːrs/", vi: "tất nhiên rồi", def: "A polite way to say yes.", cat: polite-requests, ex: ["Of course, I will send it now.", "Tất nhiên rồi, tôi gửi ngay."], col: ["yes, of course"] }
  - { t: sure, pos: adverb, ipa: "/ʃʊr/", vi: "được chứ, chắc chắn rồi", def: "A short, friendly way to say yes.", cat: polite-requests, ex: ["Sure, I can join the call.", "Được chứ, tôi có thể tham gia cuộc gọi."], col: ["sure thing", "for sure"] }
  - { t: excuse me, pos: phrase, ipa: "/ɪkˈskjuːz mi/", vi: "xin lỗi (để gây chú ý/làm phiền)", def: "Used politely to get attention or before you interrupt.", cat: polite-requests, ex: ["Excuse me, is this seat free?", "Xin lỗi, ghế này còn trống không?"], col: ["excuse me for interrupting"] }
  # Opinions & agreeing
  - { t: I think, pos: phrase, ipa: "/aɪ ˈθɪŋk/", vi: "tôi nghĩ là", def: "Used to give your opinion.", cat: opinions, ex: ["I think we should test it first.", "Tôi nghĩ chúng ta nên test trước."], col: ["I think so", "I don't think so"] }
