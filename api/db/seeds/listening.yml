# DRAFT listening content (not yet reviewed). Dialogues are short and use words from the vocabulary seeds.
# No audio files are included: upload recordings in the admin; until then the app reads the transcript with the browser voice.
lessons:
  - title: "Daily Standup: Yesterday, Today, Blockers"
    level: elementary
    description: "A short team standup. Listen for what each person did and what is blocking them."
    transcript_en: |
      Manager: Good morning, everyone. Let's start the standup. Mai, can you go first?
      Mai: Sure. Yesterday I fixed the login bug. Today I will write tests for it. I have no blockers.
      Manager: Great. Tuan, how about you?
      Tuan: Yesterday I reviewed two pull requests. Today I will start the payment page. I have one blocker. I need access to the test server.
      Manager: OK. I will ask IT to give you access today.
    transcript_vi: |
      Quản lý: Chào buổi sáng mọi người. Chúng ta bắt đầu standup nhé. Mai, bạn nói trước được không?
      Mai: Vâng. Hôm qua tôi đã sửa lỗi đăng nhập. Hôm nay tôi sẽ viết test cho nó. Tôi không có vấn đề gì cản trở.
      Quản lý: Tốt. Tuấn, còn bạn thì sao?
      Tuấn: Hôm qua tôi đã xem xét hai pull request. Hôm nay tôi sẽ bắt đầu trang thanh toán. Tôi có một vấn đề cản trở. Tôi cần quyền truy cập máy chủ thử nghiệm.
      Quản lý: Được. Tôi sẽ nhờ bộ phận IT cấp quyền cho bạn trong hôm nay.
    questions:
      - { prompt: "What did Mai do yesterday?", choices: ["She fixed the login bug.", "She wrote tests.", "She reviewed two pull requests.", "She started the payment page."], correct: 0 }
      - { prompt: "What is Tuan's blocker?", choices: ["He has too many meetings.", "He needs access to the test server.", "He cannot find the pull request.", "He is sick."], correct: 1 }
      - { prompt: "Who will ask IT for access?", choices: ["Mai", "Tuan", "The manager", "A customer"], correct: 2 }
  - title: "Code Review Feedback"
    level: elementary
    description: "A colleague gives feedback on a pull request."
    transcript_en: |
      Linh: Hi Hoang, I looked at your pull request. The code works well, but I have a small suggestion.
      Hoang: Sure, what is it?
      Linh: The function name is not very clear. Maybe you can rename it to calculateTotalPrice.
      Hoang: Good idea. I will change it and push the update this afternoon.
      Linh: Thanks. After that I will approve the pull request.
    transcript_vi: |
      Linh: Chào Hoàng, mình đã xem pull request của bạn. Code chạy tốt, nhưng mình có một gợi ý nhỏ.
      Hoàng: Được, gợi ý gì vậy?
      Linh: Tên hàm chưa rõ lắm. Có lẽ bạn có thể đổi thành calculateTotalPrice.
      Hoàng: Ý hay đấy. Mình sẽ đổi và đẩy bản cập nhật vào chiều nay.
      Linh: Cảm ơn. Sau đó mình sẽ phê duyệt pull request.
    questions:
      - { prompt: "What does Linh suggest?", choices: ["Delete the function.", "Rename the function.", "Add more tests.", "Merge the branch."], correct: 1 }
      - { prompt: "When will Hoang update the code?", choices: ["Tomorrow morning", "Tonight", "This afternoon", "Next week"], correct: 2 }
      - { prompt: "What will Linh do after the update?", choices: ["Approve the pull request.", "Write a new feature.", "Close the ticket.", "Ask for a rollback."], correct: 0 }
  - title: "Reporting a Bug"
    level: intermediate
    description: "Support reports a problem and a developer starts investigating."
    transcript_en: |
      Support: Hi team, a customer cannot upload a file. They see an error message after they click the upload button.
      Dev: Thanks. Can you reproduce the problem?
      Support: Yes, it happens every time with files larger than ten megabytes.
      Dev: I see. Let me check the logs. It may be a size limit on the server. As a workaround, ask the customer to use a smaller file.
      Support: OK. Please tell me when you find the root cause.
    transcript_vi: |
      Hỗ trợ: Chào team, một khách hàng không thể tải tệp lên. Họ thấy thông báo lỗi sau khi bấm nút tải lên.
      Dev: Cảm ơn. Bạn có thể tái hiện lỗi không?
      Hỗ trợ: Có, lỗi xảy ra mọi lần với các tệp lớn hơn mười megabyte.
      Dev: Tôi hiểu rồi. Để tôi kiểm tra log. Có thể do giới hạn kích thước trên máy chủ. Tạm thời, hãy bảo khách hàng dùng tệp nhỏ hơn.
      Hỗ trợ: Được. Khi nào tìm ra nguyên nhân gốc thì báo tôi nhé.
    questions:
      - { prompt: "When does the error happen?", choices: ["When the customer logs in", "With files larger than ten megabytes", "Only on Mondays", "After a deploy"], correct: 1 }
      - { prompt: "What does the developer check first?", choices: ["The logs", "The database backup", "The customer's email", "The sprint backlog"], correct: 0 }
      - { prompt: "What is the temporary solution?", choices: ["Restart the server.", "Roll back the release.", "Use a smaller file.", "Wait one week."], correct: 2 }
  - title: "Describing and Comparing Two Laptops"
    level: elementary
    description: "Two colleagues compare laptops. Listen for comparatives such as lighter, faster and more expensive."
    transcript_en: |
      Anna: I need a new laptop for work. Can you help me choose?
      Ben: Sure. Look at these two. This one is lighter, but that one has more memory.
      Anna: Which one is faster?
      Ben: The second one is faster, and its battery lasts longer. But it is more expensive.
      Anna: I think I will take the faster one. Speed is more important for me.
    transcript_vi: |
      Anna: Mình cần một chiếc laptop mới để làm việc. Bạn giúp mình chọn được không?
      Ben: Được. Xem hai chiếc này nhé. Chiếc này nhẹ hơn, nhưng chiếc kia có nhiều bộ nhớ hơn.
      Anna: Chiếc nào nhanh hơn?
      Ben: Chiếc thứ hai nhanh hơn và pin của nó dùng lâu hơn. Nhưng nó đắt hơn.
      Anna: Mình nghĩ mình sẽ lấy chiếc nhanh hơn. Tốc độ quan trọng hơn với mình.
    questions:
      - { prompt: "Which laptop is lighter?", choices: ["The first one", "The second one", "Both of them", "Neither of them"], correct: 0, explanation: "Ben says: This one is lighter. He is talking about the first laptop." }
      - { prompt: "What is the disadvantage of the second laptop?", choices: ["It is slower.", "Its battery is shorter.", "It is more expensive.", "It has less memory."], correct: 2 }
      - { prompt: "Why does Anna choose the faster laptop?", choices: ["It is cheaper.", "Speed is important for her.", "It is lighter.", "Ben tells her to."], correct: 1 }
  - title: "Server Outage Update"
    level: intermediate
    description: "A team talks about a website outage and what to tell customers."
    transcript_en: |
      Lead: Team, we have a problem. The website has been down since eight o'clock.
      Dev: We think the database server ran out of storage.
      Lead: How long will it take to fix?
      Dev: We are adding more storage now. It should take about thirty minutes.
      Lead: Please send an update to the customers.
      Support: Yes, I will tell them that the site is down and that we expect it to be back by nine.
    transcript_vi: |
      Trưởng nhóm: Cả nhóm, chúng ta có vấn đề. Trang web đã ngừng hoạt động từ tám giờ.
      Dev: Chúng tôi nghĩ máy chủ cơ sở dữ liệu đã hết dung lượng lưu trữ.
      Trưởng nhóm: Mất bao lâu để khắc phục?
      Dev: Chúng tôi đang thêm dung lượng. Có thể mất khoảng ba mươi phút.
      Trưởng nhóm: Hãy gửi cập nhật cho khách hàng.
      Hỗ trợ: Vâng, tôi sẽ báo họ rằng trang web đang ngừng hoạt động và chúng ta dự kiến sẽ hoạt động lại trước chín giờ.
    questions:
      - { prompt: "Since when has the website been down?", choices: ["Since seven o'clock", "Since eight o'clock", "Since nine o'clock", "Since yesterday"], correct: 1 }
      - { prompt: "What does the developer think is the cause?", choices: ["A firewall rule", "A bad password", "The database server ran out of storage", "A slow network"], correct: 2 }
      - { prompt: "What will Support do?", choices: ["Add more storage", "Send an update to customers", "Restart the website", "Write a postmortem"], correct: 1 }
  - title: "Setting Up a Meeting"
    level: elementary
    description: "Two colleagues find a time and decide what to discuss."
    transcript_en: |
      Sara: Hi Tom, can we schedule a meeting about the new feature?
      Tom: Sure. I'm available on Tuesday afternoon or Wednesday morning.
      Sara: Tuesday afternoon works for me. How about two o'clock?
      Tom: Two is fine. I'll send an invitation with the agenda.
      Sara: Great. Please add the design review as the first topic.
    transcript_vi: |
      Sara: Chào Tom, chúng ta có thể lên lịch một cuộc họp về tính năng mới không?
      Tom: Được. Mình rảnh chiều thứ Ba hoặc sáng thứ Tư.
      Sara: Chiều thứ Ba thì ổn với mình. Hai giờ được không?
      Tom: Hai giờ được. Mình sẽ gửi thư mời kèm chương trình họp.
      Sara: Tuyệt. Hãy thêm buổi review thiết kế làm chủ đề đầu tiên nhé.
    questions:
      - { prompt: "When will they meet?", choices: ["Tuesday at two o'clock", "Wednesday morning", "Tuesday morning", "Friday at two o'clock"], correct: 0 }
      - { prompt: "What will Tom send?", choices: ["A report", "An invitation with the agenda", "A design file", "A reminder about Friday"], correct: 1 }
      - { prompt: "What is the first topic?", choices: ["The deadline", "The backlog", "The design review", "The release"], correct: 2 }
  - title: "Tell Me About Yourself"
    level: intermediate
    description: "The start of a job interview for a developer."
    transcript_en: |
      Interviewer: Can you tell me about yourself?
      Candidate: Of course. I'm a backend developer with four years of experience. I mainly work with Ruby on Rails and PostgreSQL.
      Candidate: In my last job, I helped to reduce the page load time by forty percent.
      Interviewer: That's impressive. What is your biggest strength?
      Candidate: I think it's teamwork. I like to explain my ideas clearly and listen to other people.
    transcript_vi: |
      Người phỏng vấn: Bạn có thể giới thiệu về bản thân không?
      Ứng viên: Vâng. Tôi là lập trình viên backend với bốn năm kinh nghiệm. Tôi chủ yếu làm việc với Ruby on Rails và PostgreSQL.
      Ứng viên: Ở công việc trước, tôi đã giúp giảm thời gian tải trang bốn mươi phần trăm.
      Người phỏng vấn: Ấn tượng đấy. Điểm mạnh lớn nhất của bạn là gì?
      Ứng viên: Tôi nghĩ là làm việc nhóm. Tôi thích giải thích ý tưởng rõ ràng và lắng nghe người khác.
    questions:
      - { prompt: "How many years of experience does the candidate have?", choices: ["Two", "Three", "Four", "Forty"], correct: 2 }
      - { prompt: "What did the candidate help to reduce?", choices: ["The server cost", "The page load time", "The number of bugs", "The team size"], correct: 1 }
      - { prompt: "What is the candidate's biggest strength?", choices: ["Teamwork", "Speed", "Design", "Testing"], correct: 0 }
  - title: "A Security Reminder"
    level: elementary
    description: "An administrator reminds the team about passwords and suspicious emails."
    transcript_en: |
      Admin: Hi everyone, here is a quick security reminder.
      Admin: Please use a long, unique password for each account. Also, turn on two-factor authentication.
      Admin: IT will never ask for your password by email. If you get a strange email, do not click the link. Send it to the security team.
    transcript_vi: |
      Quản trị viên: Chào mọi người, đây là một lời nhắc nhanh về bảo mật.
      Quản trị viên: Hãy dùng mật khẩu dài và không trùng cho mỗi tài khoản. Ngoài ra, hãy bật xác thực hai yếu tố.
      Quản trị viên: IT sẽ không bao giờ hỏi mật khẩu của bạn qua email. Nếu nhận được email lạ, đừng bấm vào liên kết. Hãy chuyển nó cho nhóm bảo mật.
    questions:
      - { prompt: "What kind of password should you use?", choices: ["A short one", "A long and unique one", "The same one everywhere", "One that IT sends you"], correct: 1 }
      - { prompt: "What should you turn on?", choices: ["The firewall", "Two-factor authentication", "A backup", "The monitor"], correct: 1 }
      - { prompt: "What should you do with a strange email?", choices: ["Click the link to check it", "Reply with your password", "Send it to the security team", "Delete your account"], correct: 2 }
  # Everyday English (batch 3). DRAFT.
  - title: "Monday Morning Small Talk"
    level: elementary
    description: "Two colleagues chat before work. Listen for what they did at the weekend."
    transcript_en: |
      Lan: Hi Minh! How is it going?
      Minh: Not bad, thanks. A bit tired. How was your weekend?
      Lan: It was great. I went hiking with my sister. The weather was perfect.
      Minh: Nice! I stayed at home and watched a football match.
      Lan: Sounds relaxing. By the way, are you free for lunch today?
      Minh: Sure. Let's catch up at twelve.
    transcript_vi: |
      Lan: Chào Minh! Dạo này thế nào?
      Minh: Cũng ổn, cảm ơn. Hơi mệt một chút. Cuối tuần của bạn thế nào?
      Lan: Tuyệt lắm. Mình đi leo núi với chị gái. Thời tiết đẹp hoàn hảo.
      Minh: Hay quá! Mình ở nhà xem một trận bóng đá.
      Lan: Nghe thư giãn đấy. Nhân tiện, hôm nay bạn có rảnh ăn trưa không?
      Minh: Được chứ. Mười hai giờ mình gặp nhau trò chuyện nhé.
    questions:
      - { prompt: "What did Lan do at the weekend?", choices: ["She went hiking.", "She watched football.", "She worked overtime.", "She stayed at home."], correct: 0 }
      - { prompt: "How does Minh feel?", choices: ["Excited", "A bit tired", "Worried", "Sick"], correct: 1 }
      - { prompt: "When will they meet?", choices: ["At ten", "After work", "At twelve", "Tomorrow"], correct: 2 }
  - title: "Asking a Colleague for Help"
    level: elementary
    description: "A developer asks a busy colleague for help. Listen for the polite phrases."
    transcript_en: |
      Hoa: Excuse me, Nam. Do you have a minute?
      Nam: Sure, what's up?
      Hoa: I was wondering if you could help me with the deployment script. It keeps failing.
      Nam: Of course. But I am in a meeting until three. Would you mind waiting until then?
      Hoa: No worries. Thanks in advance!
      Nam: No problem. Send me the error message, and I will look at it after the meeting.
    transcript_vi: |
      Hoa: Xin lỗi anh Nam. Anh có rảnh một chút không?
      Nam: Được chứ, có chuyện gì vậy?
      Hoa: Em đang băn khoăn không biết anh có thể giúp em với script triển khai không. Nó cứ bị lỗi mãi.
      Nam: Tất nhiên. Nhưng anh họp đến ba giờ. Em có phiền đợi đến lúc đó không?
      Hoa: Không sao đâu ạ. Cảm ơn anh trước nhé!
      Nam: Không có gì. Gửi anh thông báo lỗi, họp xong anh sẽ xem.
    questions:
      - { prompt: "What does Hoa need help with?", choices: ["A presentation", "The deployment script", "A job interview", "Her laptop"], correct: 1 }
      - { prompt: "Why can Nam not help now?", choices: ["He is on sick leave.", "He is having lunch.", "He is in a meeting.", "He does not know the script."], correct: 2 }
      - { prompt: "What should Hoa send?", choices: ["The error message", "A meeting invite", "The slides", "Her code review"], correct: 0 }
  - title: "A Video Call With Problems"
    level: elementary
    description: "The start of an online meeting. Listen for the problems people have."
    transcript_en: |
      Anna: Hi everyone. Can you hear me?
      Tuan: Yes, we can hear you. But Phong, I think you are on mute.
      Phong: Sorry about that. Can you hear me now?
      Anna: Yes, much better. Phong, you are breaking up a little.
      Phong: My internet is slow today. I will turn off my camera.
      Anna: Good idea. OK, let me share my screen and we can start.
    transcript_vi: |
      Anna: Chào mọi người. Mọi người nghe tôi nói không?
      Tuấn: Có, chúng tôi nghe được. Nhưng Phong ơi, hình như bạn đang tắt micro.
      Phong: Xin lỗi nhé. Giờ mọi người nghe tôi được chưa?
      Anna: Rồi, rõ hơn nhiều. Phong, tiếng bạn hơi bị ngắt quãng.
      Phong: Hôm nay mạng nhà tôi chậm. Tôi sẽ tắt camera.
      Anna: Ý hay đấy. Được rồi, để tôi chia sẻ màn hình rồi chúng ta bắt đầu.
    questions:
      - { prompt: "What is Phong's first problem?", choices: ["His camera is broken.", "He is on mute.", "He is late.", "He cannot see the screen."], correct: 1 }
      - { prompt: "Why is Phong breaking up?", choices: ["His internet is slow.", "His microphone is old.", "There is too much noise.", "He is outside."], correct: 0 }
      - { prompt: "What will Anna do next?", choices: ["End the call", "Turn off her camera", "Share her screen", "Call Phong"], correct: 2 }
  - title: "Sorry, Could You Repeat That?"
    level: elementary
    description: "A new team member checks the details of a task. Listen for how she asks."
    transcript_en: |
      Manager: Please update the user guide and send it to the client by Thursday.
      Thu: Sorry, I did not catch that. Could you repeat the last part?
      Manager: Of course. Send it to the client by Thursday.
      Thu: Thanks. What do you mean by the user guide? The one on the website?
      Manager: Yes, exactly. The online version.
      Thu: Just to confirm, I update the online guide and email it to the client before Thursday.
      Manager: That's right.
    transcript_vi: |
      Quản lý: Em hãy cập nhật hướng dẫn sử dụng và gửi cho khách hàng trước thứ Năm nhé.
      Thu: Xin lỗi, em chưa nghe rõ. Anh nhắc lại phần cuối được không ạ?
      Quản lý: Được. Gửi cho khách hàng trước thứ Năm.
      Thu: Cảm ơn anh. Ý anh "hướng dẫn sử dụng" là bản trên trang web phải không ạ?
      Quản lý: Đúng vậy. Bản trực tuyến.
      Thu: Để xác nhận lại, em cập nhật hướng dẫn trực tuyến và gửi email cho khách trước thứ Năm.
      Quản lý: Chính xác.
    questions:
      - { prompt: "What did Thu not hear clearly?", choices: ["The client's name", "The last part", "The task name", "The meeting time"], correct: 1 }
      - { prompt: "Which user guide should she update?", choices: ["The printed one", "The online one", "The old one", "The video"], correct: 1 }
      - { prompt: "When is the deadline?", choices: ["Today", "Wednesday", "By Thursday", "Next week"], correct: 2 }
  - title: "Running Late and Rescheduling"
    level: elementary
    description: "A phone call about a meeting that needs to move. Listen for the new time."
    transcript_en: |
      Khoa: Hi Mai, it's Khoa. I'm sorry, I am running late. There is a lot of traffic.
      Mai: No worries. How late will you be?
      Khoa: About thirty minutes. Can we reschedule the meeting?
      Mai: Sure. Are you free at two o'clock this afternoon?
      Khoa: Two o'clock works for me. I will book the small meeting room.
      Mai: Great. See you later.
    transcript_vi: |
      Khoa: Chào Mai, Khoa đây. Xin lỗi, mình đang bị trễ. Đường đông xe quá.
      Mai: Không sao đâu. Bạn trễ khoảng bao lâu?
      Khoa: Khoảng ba mươi phút. Chúng ta dời cuộc họp được không?
      Mai: Được. Hai giờ chiều nay bạn có rảnh không?
      Khoa: Hai giờ thì được. Mình sẽ đặt phòng họp nhỏ.
      Mai: Tuyệt. Lát gặp nhé.
    questions:
      - { prompt: "Why is Khoa late?", choices: ["He is sick.", "There is a lot of traffic.", "He forgot the meeting.", "His laptop broke."], correct: 1 }
      - { prompt: "What is the new meeting time?", choices: ["Twelve o'clock", "One o'clock", "Two o'clock", "Tomorrow morning"], correct: 2 }
      - { prompt: "What will Khoa do?", choices: ["Book a meeting room", "Send the slides", "Call the client", "Take a day off"], correct: 0 }
  - title: "A Day Off and Working From Home"
    level: elementary
    description: "A developer talks to her manager about next week. Listen for her plans."
    transcript_en: |
      Vy: Hi Duc. Do you have a minute? I would like to take a day off next Friday.
      Duc: Sure. Is everything OK?
      Vy: Yes, it's my sister's wedding.
      Duc: Oh, congratulations to her! That's fine. Please add it to the team calendar.
      Vy: I will. Also, can I work from home on Monday? My commute will be very long because of the road works.
      Duc: No problem. Just join the standup on video.
    transcript_vi: |
      Vy: Chào anh Đức. Anh có rảnh một chút không? Em muốn xin nghỉ một ngày vào thứ Sáu tuần sau.
      Đức: Được chứ. Mọi việc ổn cả chứ?
      Vy: Dạ ổn, đám cưới chị gái em ạ.
      Đức: Ồ, chúc mừng chị ấy nhé! Không sao. Em thêm vào lịch của nhóm nhé.
      Vy: Dạ vâng. Ngoài ra, thứ Hai em làm việc ở nhà được không ạ? Đường đang sửa nên em đi làm sẽ rất lâu.
      Đức: Không vấn đề gì. Chỉ cần tham gia standup qua video là được.
    questions:
      - { prompt: "Why does Vy want a day off?", choices: ["She is sick.", "Her sister is getting married.", "She has a job interview.", "She is moving house."], correct: 1 }
      - { prompt: "What should Vy add to the team calendar?", choices: ["Her day off", "The wedding photos", "A meeting", "Her commute time"], correct: 0 }
      - { prompt: "Why will she work from home on Monday?", choices: ["Her laptop is at home.", "There is no office on Monday.", "Her commute will be long.", "She is tired."], correct: 2 }
  - title: "Agreeing and Disagreeing Politely"
    level: intermediate
    description: "A team chooses between two tools. Listen for how people give their opinions."
    transcript_en: |
      Lead: We need to choose a new testing tool. What do you think?
      Hung: In my opinion, the first tool is better. It is fast and easy to set up.
      Trang: I see your point, but to be honest, I am not sure it will scale. On the other hand, the second tool has better reports.
      Hung: That makes sense. But the second tool is more expensive.
      Lead: I suggest we try both for one week and compare.
      Trang: I agree. Let's do that.
    transcript_vi: |
      Trưởng nhóm: Chúng ta cần chọn một công cụ kiểm thử mới. Mọi người nghĩ sao?
      Hùng: Theo ý tôi, công cụ đầu tiên tốt hơn. Nó nhanh và dễ cài đặt.
