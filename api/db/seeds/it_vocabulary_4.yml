  # B2: Leading & influencing
  - { t: consensus, pos: noun, ipa: "/kənˈsensəs/", vi: "sự đồng thuận", def: "Agreement among all or most people in a group.", cat: leading-influencing, ex: ["We reached a consensus on the new architecture.", "Chúng tôi đã đạt được đồng thuận về kiến trúc mới."], col: ["reach a consensus", "build consensus"] }
  - { t: persuade, pos: verb, ipa: "/pərˈsweɪd/", vi: "thuyết phục", def: "To make someone agree to do or believe something by giving good reasons.", cat: leading-influencing, ex: ["She persuaded the client to extend the deadline.", "Cô ấy đã thuyết phục khách hàng gia hạn thời hạn."], col: ["persuade someone to", "try to persuade"] }
  - { t: negotiate, pos: verb, ipa: "/nɪˈɡoʊʃieɪt/", vi: "đàm phán", def: "To discuss something to reach an agreement both sides accept.", cat: leading-influencing, ex: ["We need to negotiate the scope with the client.", "Chúng ta cần đàm phán phạm vi với khách hàng."], col: ["negotiate a contract", "negotiate the scope"] }
  - { t: compromise, pos: noun, ipa: "/ˈkɑːmprəmaɪz/", vi: "sự thỏa hiệp", def: "An agreement where each side gives up part of what it wanted.", cat: leading-influencing, ex: ["The compromise was to release half of the features in May.", "Phương án thỏa hiệp là phát hành một nửa tính năng vào tháng Năm."], col: ["reach a compromise", "fair compromise"] }
  - { t: accountability, pos: noun, ipa: "/əˌkaʊntəˈbɪləti/", vi: "trách nhiệm giải trình", def: "Being responsible for your decisions and their results.", cat: leading-influencing, ex: ["Clear accountability helps the team move faster.", "Trách nhiệm rõ ràng giúp cả nhóm làm nhanh hơn."], col: ["take accountability", "lack of accountability"] }
  - { t: initiative, pos: noun, ipa: "/ɪˈnɪʃətɪv/", vi: "sự chủ động, sáng kiến", def: "The ability to act without being told; or a new plan to solve a problem.", cat: leading-influencing, ex: ["He took the initiative to fix the flaky tests.", "Anh ấy đã chủ động sửa các bài test không ổn định."], col: ["take the initiative", "new initiative"] }
  - { t: feasibility, pos: noun, ipa: "/ˌfiːzəˈbɪləti/", vi: "tính khả thi", def: "How possible and practical it is to do something.", cat: leading-influencing, ex: ["We are checking the feasibility of the migration.", "Chúng tôi đang kiểm tra tính khả thi của việc chuyển đổi."], col: ["feasibility study", "technical feasibility"] }
  - { t: buy-in, pos: noun, ipa: "/ˈbaɪ ɪn/", vi: "sự ủng hộ, đồng thuận (từ các bên)", def: "Agreement and support for a plan from the people it affects.", cat: leading-influencing, ex: ["We need buy-in from the product team first.", "Trước tiên chúng ta cần sự ủng hộ từ nhóm sản phẩm."], col: ["get buy-in", "stakeholder buy-in"] }
  - { t: bottleneck, pos: noun, ipa: "/ˈbɑːtlnek/", vi: "điểm nghẽn", def: "One part of a process that slows down everything else.", cat: leading-influencing, ex: ["Code review has become our biggest bottleneck.", "Review mã đã trở thành điểm nghẽn lớn nhất của chúng tôi."], col: ["remove a bottleneck", "performance bottleneck"] }
  - { t: mitigate, pos: verb, ipa: "/ˈmɪtɪɡeɪt/", vi: "giảm thiểu", def: "To make a risk or a problem less serious.", cat: leading-influencing, ex: ["A feature flag will mitigate the risk.", "Một công tắc tính năng sẽ giảm thiểu rủi ro."], col: ["mitigate the risk", "mitigate the impact"] }
  - { t: leverage, pos: verb, ipa: "/ˈlevərɪdʒ/", vi: "tận dụng", def: "To use something you have to get a better result.", cat: leading-influencing, ex: ["We can leverage the existing API instead of building a new one.", "Chúng ta có thể tận dụng API sẵn có thay vì xây mới."], col: ["leverage experience", "leverage existing tools"] }
  - { t: push back, pos: verb, ipa: "/ˌpʊʃ ˈbæk/", vi: "phản đối, đẩy lùi (yêu cầu)", def: "To disagree with a request or plan and resist it.", cat: leading-influencing, ex: ["It is fine to push back if the deadline is not realistic.", "Phản đối là bình thường nếu hạn chót không thực tế."], col: ["push back on", "push back the deadline"] }
  - { t: stakeholder management, pos: noun, ipa: "/ˈsteɪkhoʊldər ˌmænɪdʒmənt/", vi: "quản lý các bên liên quan", def: "Keeping the people affected by a project informed and on board.", cat: leading-influencing, ex: ["Good stakeholder management prevents surprises at the end.", "Quản lý tốt các bên liên quan giúp tránh bất ngờ lúc cuối."], col: ["stakeholder management plan"] }
  - { t: rationale, pos: noun, ipa: "/ˌræʃəˈnæl/", vi: "lý do, cơ sở (của quyết định)", def: "The reasons for a decision.", cat: leading-influencing, ex: ["Please explain the rationale behind this design.", "Vui lòng giải thích lý do đằng sau thiết kế này."], col: ["the rationale behind", "clear rationale"] }
  # B2: Advanced architecture
  - { t: throughput, pos: noun, ipa: "/ˈθruːpʊt/", vi: "thông lượng", def: "How much work a system can handle in a period of time.", cat: advanced-architecture, ex: ["The new queue doubled our throughput.", "Hàng đợi mới đã tăng gấp đôi thông lượng của chúng tôi."], col: ["high throughput", "increase throughput"] }
  - { t: idempotent, pos: adjective, ipa: "/ˌaɪdəmˈpoʊtənt/", vi: "lũy đẳng (gọi nhiều lần vẫn cùng kết quả)", def: "Giving the same result when you repeat it, so a retry is safe.", cat: advanced-architecture, ex: ["The payment endpoint must be idempotent.", "Endpoint thanh toán phải có tính lũy đẳng."], col: ["idempotent request", "make it idempotent"] }
  - { t: eventual consistency, pos: noun, ipa: "/ɪˌventʃuəl kənˈsɪstənsi/", vi: "nhất quán cuối cùng", def: "A model where data in different places becomes the same after a short delay.", cat: advanced-architecture, ex: ["With eventual consistency, users may see old data for a few seconds.", "Với nhất quán cuối cùng, người dùng có thể thấy dữ liệu cũ trong vài giây."], col: ["eventual consistency model"] }
  - { t: fault tolerance, pos: noun, ipa: "/ˈfɔːlt ˌtɑːlərəns/", vi: "khả năng chịu lỗi", def: "The ability of a system to keep working when one part fails.", cat: advanced-architecture, ex: ["We added a second region for fault tolerance.", "Chúng tôi thêm vùng thứ hai để tăng khả năng chịu lỗi."], col: ["improve fault tolerance"] }
  - { t: redundancy, pos: noun, ipa: "/rɪˈdʌndənsi/", vi: "dự phòng (thành phần thừa để an toàn)", def: "Extra copies of a part, used if the main one fails.", cat: advanced-architecture, ex: ["Redundancy costs more, but it reduces downtime.", "Dự phòng tốn kém hơn, nhưng giảm thời gian ngừng hoạt động."], col: ["build in redundancy", "data redundancy"] }
  - { t: observability, pos: noun, ipa: "/əbˌzɜːrvəˈbɪləti/", vi: "khả năng quan sát (hệ thống)", def: "How well you can understand what a system is doing from its logs, metrics and traces.", cat: advanced-architecture, ex: ["Better observability helped us find the slow query.", "Khả năng quan sát tốt hơn đã giúp chúng tôi tìm ra truy vấn chậm."], col: ["improve observability", "observability tools"] }
  - { t: technical debt, pos: noun, ipa: "/ˌteknɪkəl ˈdet/", vi: "nợ kỹ thuật", def: "Extra work later caused by choosing a quick solution now.", cat: advanced-architecture, ex: ["We plan one sprint each quarter to pay down technical debt.", "Mỗi quý chúng tôi dành một sprint để trả bớt nợ kỹ thuật."], col: ["pay down technical debt", "accumulate technical debt"] }
  - { t: backward compatible, pos: adjective, ipa: "/ˌbækwərd kəmˈpætəbəl/", vi: "tương thích ngược", def: "Working with older versions, so existing users are not broken.", cat: advanced-architecture, ex: ["The new API version is backward compatible.", "Phiên bản API mới tương thích ngược."], col: ["fully backward compatible"] }
  - { t: race condition, pos: noun, ipa: "/ˈreɪs kənˌdɪʃən/", vi: "tình trạng tranh chấp (race condition)", def: "A bug where the result depends on which of two actions happens first.", cat: advanced-architecture, ex: ["The duplicate orders came from a race condition.", "Các đơn hàng trùng là do một race condition."], col: ["fix a race condition"] }
  - { t: deadlock, pos: noun, ipa: "/ˈdedlɑːk/", vi: "bế tắc (khóa chết)", def: "A situation where two processes wait for each other forever.", cat: advanced-architecture, ex: ["The database reported a deadlock during the import.", "Cơ sở dữ liệu báo bế tắc trong lúc nhập dữ liệu."], col: ["avoid a deadlock", "database deadlock"] }
  - { t: load balancer, pos: noun, ipa: "/ˈloʊd ˌbælənsər/", vi: "bộ cân bằng tải", def: "A service that spreads requests across several servers.", cat: advanced-architecture, ex: ["The load balancer sends traffic to three servers.", "Bộ cân bằng tải chia lưu lượng cho ba máy chủ."], col: ["behind a load balancer"] }
  - { t: single point of failure, pos: noun, ipa: "/ˌsɪŋɡəl ˌpɔɪnt əv ˈfeɪljər/", vi: "điểm lỗi duy nhất", def: "One part that stops the whole system if it fails.", cat: advanced-architecture, ex: ["The old database was a single point of failure.", "Cơ sở dữ liệu cũ là điểm lỗi duy nhất."], col: ["remove a single point of failure"] }
  - { t: concurrency, pos: noun, ipa: "/kənˈkɜːrənsi/", vi: "xử lý đồng thời", def: "Doing several tasks at the same time.", cat: advanced-architecture, ex: ["Concurrency bugs are hard to reproduce.", "Lỗi xử lý đồng thời rất khó tái hiện."], col: ["concurrency control", "high concurrency"] }
  - { t: sharding, pos: noun, ipa: "/ˈʃɑːrdɪŋ/", vi: "phân mảnh dữ liệu", def: "Splitting a large database into smaller parts on different servers.", cat: advanced-architecture, ex: ["We started sharding when the table reached a billion rows.", "Chúng tôi bắt đầu phân mảnh khi bảng đạt một tỷ dòng."], col: ["database sharding"] }
  # B2: Presenting & writing
  - { t: to sum up, pos: phrase, ipa: "/tə ˌsʌm ˈʌp/", vi: "tóm lại", def: "Used before a short summary of what you have said.", cat: presenting-writing, ex: ["To sum up, the new design is faster and cheaper.", "Tóm lại, thiết kế mới nhanh hơn và rẻ hơn."], col: ["so, to sum up"] }
  - { t: key takeaway, pos: noun, ipa: "/ˌkiː ˈteɪkəweɪ/", vi: "điểm chính cần nhớ", def: "The most important idea people should remember.", cat: presenting-writing, ex: ["The key takeaway is that we must test earlier.", "Điểm chính cần nhớ là chúng ta phải test sớm hơn."], col: ["main takeaway"] }
  - { t: bear in mind, pos: phrase, ipa: "/ˌber ɪn ˈmaɪnd/", vi: "lưu ý, ghi nhớ", def: "To remember a fact that matters when you decide.", cat: presenting-writing, ex: ["Bear in mind that the client is in another time zone.", "Lưu ý rằng khách hàng ở múi giờ khác."], col: ["please bear in mind"] }
  - { t: it is worth noting, pos: phrase, ipa: "/ɪt ɪz ˌwɜːrθ ˈnoʊtɪŋ/", vi: "cần lưu ý rằng", def: "Used to point out a fact that is important.", cat: presenting-writing, ex: ["It is worth noting that the old system still works.", "Cần lưu ý rằng hệ thống cũ vẫn hoạt động."], col: ["it's worth noting that"] }
  - { t: on balance, pos: phrase, ipa: "/ɑːn ˈbæləns/", vi: "cân nhắc mọi mặt thì", def: "After thinking about all the good and bad points.", cat: presenting-writing, ex: ["On balance, I think we should wait one more week.", "Cân nhắc mọi mặt, tôi nghĩ chúng ta nên đợi thêm một tuần."], col: ["on balance, I think"] }
  - { t: in terms of, pos: phrase, ipa: "/ɪn ˈtɜːrmz əv/", vi: "về mặt", def: "Used to say which part of a topic you are talking about.", cat: presenting-writing, ex: ["In terms of cost, the cloud option is cheaper.", "Về mặt chi phí, phương án đám mây rẻ hơn."], col: ["in terms of performance"] }
  - { t: whereas, pos: phrase, ipa: "/werˈæz/", vi: "trong khi đó", def: "Used to compare two facts that are different.", cat: presenting-writing, ex: ["Option A is fast, whereas option B is more reliable.", "Phương án A nhanh, trong khi đó phương án B đáng tin cậy hơn."], col: [] }
  - { t: as a result, pos: phrase, ipa: "/æz ə rɪˈzʌlt/", vi: "kết quả là", def: "Used to introduce what happened because of something.", cat: presenting-writing, ex: ["The cache expired. As a result, the page was slow.", "Bộ nhớ đệm hết hạn. Kết quả là trang bị chậm."], col: ["as a result of"] }
  - { t: elaborate, pos: verb, ipa: "/ɪˈlæbəreɪt/", vi: "trình bày chi tiết hơn", def: "To give more details about something.", cat: presenting-writing, ex: ["Could you elaborate on the second risk?", "Bạn có thể nói chi tiết hơn về rủi ro thứ hai không?"], col: ["elaborate on"] }
  - { t: outline, pos: verb, ipa: "/ˈaʊtlaɪn/", vi: "phác thảo, trình bày khái quát", def: "To describe the main points without details.", cat: presenting-writing, ex: ["Let me outline the plan for the next quarter.", "Để tôi trình bày khái quát kế hoạch cho quý tới."], col: ["outline a plan", "briefly outline"] }
  - { t: emphasize, pos: verb, ipa: "/ˈemfəsaɪz/", vi: "nhấn mạnh", def: "To show that something is especially important.", cat: presenting-writing, ex: ["I want to emphasize that security comes first.", "Tôi muốn nhấn mạnh rằng bảo mật là trên hết."], col: ["emphasize the importance of"] }
  - { t: to put it simply, pos: phrase, ipa: "/tə ˌpʊt ɪt ˈsɪmpli/", vi: "nói một cách đơn giản", def: "Used before you explain something in an easy way.", cat: presenting-writing, ex: ["To put it simply, the server ran out of memory.", "Nói đơn giản, máy chủ đã hết bộ nhớ."], col: ["to put it another way"] }
  - { t: going forward, pos: phrase, ipa: "/ˌɡoʊɪŋ ˈfɔːrwərd/", vi: "từ nay về sau", def: "From now on, in the future.", cat: presenting-writing, ex: ["Going forward, every pull request needs two reviewers.", "Từ nay, mỗi pull request cần hai người review."], col: [] }

