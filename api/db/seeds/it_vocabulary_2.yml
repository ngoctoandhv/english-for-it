  - { t: regex, pos: noun, ipa: "/ˈredʒeks/", vi: "biểu thức chính quy", def: "A short pattern that finds and matches text.", cat: say-it-right, ex: ["I used a regex to check the email format.", "Tôi đã dùng một regex để kiểm tra định dạng email."], col: ["write a regex", "regex pattern"] }
  - { t: cron, pos: noun, ipa: "/krɑːn/", vi: "cron (lịch chạy tự động)", def: "A tool that runs tasks automatically at set times.", cat: say-it-right, ex: ["A cron job sends the report every morning.", "Một cron job gửi báo cáo mỗi sáng."], col: ["cron job", "set up cron"] }
