categories:
  - { slug: testing-qa, name: Testing & QA, level: b1 }
  - { slug: devops-ci-cd, name: DevOps & CI/CD, level: b2 }
  - { slug: apis-architecture, name: APIs & Architecture, level: b2 }
  - { slug: frontend-backend, name: Frontend & Backend, level: b1 }
  - { slug: project-planning, name: Projects & Planning, level: b1 }
  - { slug: working-together, name: Working Together, level: a2 }
  - { slug: say-it-right, name: Say It Right, level: a2 }

words:
  # Testing & QA
  - { t: test case, pos: noun, ipa: "/ˈtest keɪs/", vi: "ca kiểm thử", def: "A set of steps and expected results used to check one behavior.", cat: testing-qa, ex: ["I wrote a test case for the login error.", "Tôi đã viết một ca kiểm thử cho lỗi đăng nhập."], col: ["write a test case", "failing test case"] }
  - { t: unit test, pos: noun, ipa: "/ˈjuːnɪt test/", vi: "kiểm thử đơn vị", def: "A small test that checks one function or class on its own.", cat: testing-qa, ex: ["Please add a unit test for this function.", "Hãy thêm một unit test cho hàm này."], col: ["add a unit test", "run unit tests"] }
  - { t: integration test, pos: noun, ipa: "/ˌɪntɪˈɡreɪʃən test/", vi: "kiểm thử tích hợp", def: "A test that checks that several parts of a system work together.", cat: testing-qa, ex: ["The integration test fails when the database is slow.", "Bài kiểm thử tích hợp thất bại khi cơ sở dữ liệu chậm."], col: ["integration test suite", "run integration tests"] }
  - { t: test coverage, pos: noun, ipa: "/ˈtest ˌkʌvərɪdʒ/", vi: "độ phủ kiểm thử", def: "The share of the code that the tests run.", cat: testing-qa, ex: ["Our test coverage is about eighty percent.", "Độ phủ kiểm thử của chúng tôi khoảng tám mươi phần trăm."], col: ["increase test coverage", "low test coverage"] }
  - { t: assertion, pos: noun, ipa: "/əˈsɜːrʃən/", vi: "câu khẳng định (trong test)", def: "A line in a test that checks that a result is what you expect.", cat: testing-qa, ex: ["The assertion fails because the total is wrong.", "Câu assertion thất bại vì tổng tiền bị sai."], col: ["add an assertion", "assertion fails"] }
  - { t: mock, pos: verb, ipa: "/mɑːk/", vi: "giả lập (đối tượng khi test)", def: "To replace a real part of the system with a fake one in a test.", cat: testing-qa, ex: ["We mock the payment service in the tests.", "Chúng tôi giả lập dịch vụ thanh toán trong các bài test."], col: ["mock a service", "mock the API"] }
  - { t: flaky test, pos: noun, ipa: "/ˈfleɪki test/", vi: "test không ổn định (lúc đúng lúc sai)", def: "A test that sometimes passes and sometimes fails without any code change.", cat: testing-qa, ex: ["This flaky test blocked the release again.", "Test không ổn định này lại chặn đợt phát hành."], col: ["fix a flaky test", "flaky tests slow us down"] }
  - { t: edge case, pos: noun, ipa: "/ˈedʒ keɪs/", vi: "trường hợp biên", def: "An unusual situation at the limit of what the system should handle.", cat: testing-qa, ex: ["What happens in this edge case, an empty list?", "Chuyện gì xảy ra ở trường hợp biên này, một danh sách rỗng?"], col: ["handle edge cases", "miss an edge case"] }
  - { t: acceptance criteria, pos: noun, ipa: "/əkˈseptəns kraɪˈtɪriə/", vi: "tiêu chí chấp nhận", def: "The conditions a feature must meet before the team counts it as done.", cat: testing-qa, ex: ["Check the acceptance criteria before you close the ticket.", "Hãy kiểm tra tiêu chí chấp nhận trước khi đóng ticket."], col: ["meet the acceptance criteria", "define acceptance criteria"] }
  - { t: smoke test, pos: noun, ipa: "/ˈsmoʊk test/", vi: "kiểm thử nhanh sau khi triển khai", def: "A quick check that the main functions work after a new version is deployed.", cat: testing-qa, ex: ["I ran a smoke test on staging, and it passed.", "Tôi đã chạy smoke test trên staging và nó đã qua."], col: ["run a smoke test", "smoke test passed"] }
  - { t: bug report, pos: noun, ipa: "/ˈbʌɡ rɪˌpɔːrt/", vi: "báo cáo lỗi", def: "A written description of a problem, with the steps to see it.", cat: testing-qa, ex: ["A good bug report includes the steps to reproduce.", "Một báo cáo lỗi tốt có các bước để tái hiện lỗi."], col: ["file a bug report", "detailed bug report"] }
  - { t: severity, pos: noun, ipa: "/sɪˈverəti/", vi: "mức độ nghiêm trọng", def: "How serious a problem is for the users or the system.", cat: testing-qa, ex: ["We set the severity to high because users cannot pay.", "Chúng tôi đặt mức nghiêm trọng là cao vì người dùng không thể thanh toán."], col: ["high severity", "set the severity"] }
  - { t: verify, pos: verb, ipa: "/ˈverɪfaɪ/", vi: "xác minh", def: "To check that something is true or works as expected.", cat: testing-qa, ex: ["Can you verify the fix on staging?", "Bạn có thể xác minh bản sửa trên staging không?"], col: ["verify the fix", "verify the result"] }
  - { t: test environment, pos: noun, ipa: "/ˈtest ɪnˌvaɪrənmənt/", vi: "môi trường kiểm thử", def: "A copy of the system used only for testing, not for real users.", cat: testing-qa, ex: ["The bug only appears in the test environment.", "Lỗi chỉ xuất hiện trong môi trường kiểm thử."], col: ["set up a test environment", "test environment is down"] }
  - { t: pass, pos: verb, ipa: "/pæs/", vi: "vượt qua (test)", def: "To succeed in a test or a check.", cat: testing-qa, ex: ["All the tests pass on my machine.", "Tất cả test đều qua trên máy của tôi."], col: ["tests pass", "pass the check"] }
  # DevOps & CI/CD
  - { t: build, pos: noun, ipa: "/bɪld/", vi: "bản dựng, lần build", def: "The process or result of turning source code into a program that can run.", cat: devops-ci-cd, ex: ["The build failed after my last commit.", "Lần build thất bại sau commit cuối của tôi."], col: ["build fails", "trigger a build"] }
  - { t: continuous integration, pos: noun, ipa: "/kənˌtɪnjuəs ˌɪntɪˈɡreɪʃən/", vi: "tích hợp liên tục (CI)", def: "A practice where every change is built and tested automatically.", cat: devops-ci-cd, ex: ["Continuous integration catches errors early.", "Tích hợp liên tục giúp bắt lỗi sớm."], col: ["continuous integration server", "set up continuous integration"] }
  - { t: artifact, pos: noun, ipa: "/ˈɑːrtɪfækt/", vi: "tệp kết quả của build", def: "A file produced by a build, such as a package or an installer.", cat: devops-ci-cd, ex: ["The pipeline uploads the artifact after the tests pass.", "Pipeline tải tệp kết quả lên sau khi test qua."], col: ["build artifact", "download the artifact"] }
  - { t: monitoring, pos: noun, ipa: "/ˈmɑːnɪtərɪŋ/", vi: "giám sát", def: "Watching a system all the time to see if it is healthy.", cat: devops-ci-cd, ex: ["Our monitoring showed high memory use before the outage.", "Hệ thống giám sát cho thấy bộ nhớ tăng cao trước khi sự cố xảy ra."], col: ["set up monitoring", "monitoring tool"] }
  - { t: alert, pos: noun, ipa: "/əˈlɜːrt/", vi: "cảnh báo", def: "An automatic message that tells people something needs attention.", cat: devops-ci-cd, ex: ["I got an alert that the server is almost full.", "Tôi nhận được cảnh báo rằng máy chủ gần đầy."], col: ["set up an alert", "alert goes off"] }
  - { t: dashboard, pos: noun, ipa: "/ˈdæʃbɔːrd/", vi: "bảng theo dõi (dashboard)", def: "A screen that shows the main numbers about a system in one place.", cat: devops-ci-cd, ex: ["Check the dashboard for error rates.", "Hãy xem bảng theo dõi để biết tỷ lệ lỗi."], col: ["monitoring dashboard", "open the dashboard"] }
  - { t: incident, pos: noun, ipa: "/ˈɪnsɪdənt/", vi: "sự cố", def: "An event that breaks or slows a service for users.", cat: devops-ci-cd, ex: ["We are handling an incident with the login service.", "Chúng tôi đang xử lý một sự cố với dịch vụ đăng nhập."], col: ["handle an incident", "incident report"] }
  - { t: on-call, pos: adjective, ipa: "/ˌɑːn ˈkɔːl/", vi: "trực (khi có sự cố)", def: "Ready to respond to problems outside normal work hours.", cat: devops-ci-cd, ex: ["I am on-call this weekend.", "Cuối tuần này tôi trực sự cố."], col: ["on-call engineer", "on-call schedule"] }
  - { t: postmortem, pos: noun, ipa: "/poʊstˈmɔːrtəm/", vi: "buổi/báo cáo rút kinh nghiệm sau sự cố", def: "A review after an incident to learn what happened and how to prevent it.", cat: devops-ci-cd, ex: ["We will write a postmortem tomorrow.", "Ngày mai chúng tôi sẽ viết báo cáo rút kinh nghiệm."], col: ["write a postmortem", "postmortem meeting"] }
  - { t: rollout, pos: noun, ipa: "/ˈroʊlaʊt/", vi: "đợt triển khai dần", def: "The process of making a new version available to users step by step.", cat: devops-ci-cd, ex: ["The rollout starts with five percent of users.", "Đợt triển khai bắt đầu với năm phần trăm người dùng."], col: ["gradual rollout", "pause the rollout"] }
  - { t: feature flag, pos: noun, ipa: "/ˈfiːtʃər flæɡ/", vi: "công tắc tính năng", def: "A setting that turns a feature on or off without a new deployment.", cat: devops-ci-cd, ex: ["The new checkout is behind a feature flag.", "Trang thanh toán mới nằm sau một công tắc tính năng."], col: ["turn on a feature flag", "behind a feature flag"] }
  - { t: hotfix, pos: noun, ipa: "/ˈhɑːtfɪks/", vi: "bản vá khẩn cấp", def: "A quick fix released outside the normal schedule to solve an urgent problem.", cat: devops-ci-cd, ex: ["We shipped a hotfix for the payment bug.", "Chúng tôi đã phát hành bản vá khẩn cấp cho lỗi thanh toán."], col: ["ship a hotfix", "hotfix branch"] }
  - { t: infrastructure, pos: noun, ipa: "/ˈɪnfrəˌstrʌktʃər/", vi: "hạ tầng", def: "The servers, networks and services that applications run on.", cat: devops-ci-cd, ex: ["The infrastructure team manages our servers.", "Nhóm hạ tầng quản lý các máy chủ của chúng tôi."], col: ["cloud infrastructure", "infrastructure cost"] }
  - { t: configuration, pos: noun, ipa: "/kənˌfɪɡjəˈreɪʃən/", vi: "cấu hình", def: "Settings that control how a program or system behaves.", cat: devops-ci-cd, ex: ["The error comes from a wrong configuration.", "Lỗi đến từ một cấu hình sai."], col: ["change the configuration", "configuration file"] }
  - { t: automate, pos: verb, ipa: "/ˈɔːtəmeɪt/", vi: "tự động hóa", def: "To make a task run by itself, without a person doing it by hand.", cat: devops-ci-cd, ex: ["Let's automate the release steps.", "Hãy tự động hóa các bước phát hành."], col: ["automate a task", "automate testing"] }
  # APIs & Architecture
  - { t: API, pos: noun, ipa: "/ˌeɪ piː ˈaɪ/", vi: "giao diện lập trình ứng dụng", def: "A set of rules that lets one program talk to another.", cat: apis-architecture, ex: ["The mobile app calls our API.", "Ứng dụng di động gọi API của chúng tôi."], col: ["call an API", "REST API"] }
  - { t: endpoint, pos: noun, ipa: "/ˈendpɔɪnt/", vi: "điểm cuối của API", def: "A specific address of an API that you send requests to.", cat: apis-architecture, ex: ["The new endpoint returns the user profile.", "Endpoint mới trả về hồ sơ người dùng."], col: ["API endpoint", "add an endpoint"] }
  - { t: payload, pos: noun, ipa: "/ˈpeɪloʊd/", vi: "dữ liệu gửi kèm yêu cầu", def: "The data that you send or receive in a request or a response.", cat: apis-architecture, ex: ["The payload is too large for this endpoint.", "Dữ liệu gửi kèm quá lớn cho endpoint này."], col: ["request payload", "JSON payload"] }
  - { t: token, pos: noun, ipa: "/ˈtoʊkən/", vi: "mã thông hành (token)", def: "A string that proves who you are when you call a service.", cat: apis-architecture, ex: ["The token expires after fifteen minutes.", "Token hết hạn sau mười lăm phút."], col: ["access token", "token expires"] }
  - { t: rate limit, pos: noun, ipa: "/ˈreɪt ˌlɪmɪt/", vi: "giới hạn số yêu cầu", def: "A rule that limits how many requests a client can send in a period of time.", cat: apis-architecture, ex: ["We hit the rate limit during the import.", "Chúng tôi chạm giới hạn số yêu cầu trong lúc nhập dữ liệu."], col: ["hit the rate limit", "rate limit exceeded"] }
  - { t: cache, pos: noun, ipa: "/kæʃ/", vi: "bộ nhớ đệm", def: "A place that stores copies of data so it can be read faster.", cat: apis-architecture, ex: ["Clear the cache and try again.", "Hãy xóa bộ nhớ đệm rồi thử lại."], col: ["clear the cache", "cache hit"] }
  - { t: queue, pos: noun, ipa: "/kjuː/", vi: "hàng đợi", def: "A list of tasks or messages that wait to be processed one by one.", cat: apis-architecture, ex: ["The job is waiting in the queue.", "Công việc đang chờ trong hàng đợi."], col: ["message queue", "join the queue"] }
  - { t: microservice, pos: noun, ipa: "/ˈmaɪkroʊˌsɜːrvɪs/", vi: "vi dịch vụ", def: "A small service that does one job and works with other small services.", cat: apis-architecture, ex: ["Each team owns its own microservice.", "Mỗi nhóm sở hữu một vi dịch vụ riêng."], col: ["microservice architecture", "split into microservices"] }
  - { t: dependency, pos: noun, ipa: "/dɪˈpendənsi/", vi: "phụ thuộc (thư viện/dịch vụ)", def: "A library or service that your code needs in order to work.", cat: apis-architecture, ex: ["We should update this old dependency.", "Chúng ta nên cập nhật phụ thuộc cũ này."], col: ["add a dependency", "outdated dependency"] }
  - { t: schema, pos: noun, ipa: "/ˈskiːmə/", vi: "lược đồ (cấu trúc dữ liệu)", def: "A description of how data is organized, such as the tables and fields.", cat: apis-architecture, ex: ["We changed the database schema last week.", "Tuần trước chúng tôi đã đổi lược đồ cơ sở dữ liệu."], col: ["database schema", "update the schema"] }
  - { t: middleware, pos: noun, ipa: "/ˈmɪdlwer/", vi: "phần mềm trung gian", def: "Code that sits between a request and the main logic and handles shared tasks.", cat: apis-architecture, ex: ["The authentication runs in a middleware.", "Việc xác thực chạy trong một middleware."], col: ["add middleware", "logging middleware"] }
  - { t: integrate, pos: verb, ipa: "/ˈɪntɪɡreɪt/", vi: "tích hợp", def: "To connect one system with another so they work together.", cat: apis-architecture, ex: ["We will integrate the app with the payment provider.", "Chúng tôi sẽ tích hợp ứng dụng với nhà cung cấp thanh toán."], col: ["integrate with", "easy to integrate"] }
  - { t: documentation, pos: noun, ipa: "/ˌdɑːkjumenˈteɪʃən/", vi: "tài liệu hướng dẫn", def: "Written explanations of how a system or a tool works.", cat: apis-architecture, ex: ["The documentation does not explain this error.", "Tài liệu không giải thích lỗi này."], col: ["read the documentation", "update the documentation"] }
  - { t: deprecate, pos: verb, ipa: "/ˈdeprəkeɪt/", vi: "ngừng khuyến khích (sẽ gỡ bỏ)", def: "To mark a feature as old, so people should stop using it.", cat: apis-architecture, ex: ["They will deprecate this endpoint next year.", "Họ sẽ ngừng hỗ trợ endpoint này vào năm sau."], col: ["deprecated API", "deprecate a feature"] }
  # Frontend & Backend
  - { t: frontend, pos: noun, ipa: "/ˈfrʌntend/", vi: "phần giao diện người dùng", def: "The part of an application that users see and use in their browser or app.", cat: frontend-backend, ex: ["The frontend shows an error message.", "Phần giao diện hiển thị một thông báo lỗi."], col: ["frontend developer", "frontend code"] }
  - { t: backend, pos: noun, ipa: "/ˈbækend/", vi: "phần xử lý phía máy chủ", def: "The part of an application that runs on the server and handles data and logic.", cat: frontend-backend, ex: ["The backend returns the wrong status code.", "Phần máy chủ trả về sai mã trạng thái."], col: ["backend developer", "backend service"] }
  - { t: framework, pos: noun, ipa: "/ˈfreɪmwɜːrk/", vi: "khung phát triển", def: "A set of tools and rules that gives structure to how you build an application.", cat: frontend-backend, ex: ["Which framework do you use for the website?", "Bạn dùng framework nào cho trang web?"], col: ["web framework", "choose a framework"] }
  - { t: library, pos: noun, ipa: "/ˈlaɪbreri/", vi: "thư viện (mã)", def: "A collection of ready-made code that you can use in your own program.", cat: frontend-backend, ex: ["We use a library for date formatting.", "Chúng tôi dùng một thư viện để định dạng ngày."], col: ["open source library", "install a library"] }
  - { t: component, pos: noun, ipa: "/kəmˈpoʊnənt/", vi: "thành phần giao diện", def: "A reusable piece of a user interface, such as a button or a form.", cat: frontend-backend, ex: ["I moved the button into a separate component.", "Tôi đã tách nút bấm thành một component riêng."], col: ["reusable component", "React component"] }
  - { t: render, pos: verb, ipa: "/ˈrendər/", vi: "hiển thị (vẽ ra giao diện)", def: "To draw the user interface on the screen from data and code.", cat: frontend-backend, ex: ["The page renders slowly on mobile.", "Trang hiển thị chậm trên điện thoại."], col: ["render a page", "render on the server"] }
  - { t: responsive, pos: adjective, ipa: "/rɪˈspɑːnsɪv/", vi: "thích ứng nhiều kích thước màn hình", def: "Able to change its layout to fit different screen sizes.", cat: frontend-backend, ex: ["The new design is fully responsive.", "Thiết kế mới thích ứng hoàn toàn với mọi kích thước màn hình."], col: ["responsive design", "responsive layout"] }
  - { t: accessibility, pos: noun, ipa: "/əkˌsesəˈbɪləti/", vi: "khả năng tiếp cận", def: "Making sure that people with disabilities can use the product.", cat: frontend-backend, ex: ["Accessibility is part of our definition of done.", "Khả năng tiếp cận là một phần trong định nghĩa hoàn thành của chúng tôi."], col: ["accessibility check", "improve accessibility"] }
  - { t: state, pos: noun, ipa: "/steɪt/", vi: "trạng thái (dữ liệu hiện tại)", def: "The data that describes what an application looks like and does right now.", cat: frontend-backend, ex: ["The bug happens when the state is empty.", "Lỗi xảy ra khi trạng thái đang rỗng."], col: ["application state", "update the state"] }
  - { t: bundle, pos: noun, ipa: "/ˈbʌndl/", vi: "gói mã đã đóng gói", def: "A file that combines many pieces of code so the browser can load them.", cat: frontend-backend, ex: ["The bundle is too big, so the page loads slowly.", "Gói mã quá lớn nên trang tải chậm."], col: ["bundle size", "JavaScript bundle"] }
  # Projects & Planning
  - { t: stakeholder, pos: noun, ipa: "/ˈsteɪkhoʊldər/", vi: "bên liên quan", def: "A person or group who is affected by the project or who has a say in it.", cat: project-planning, ex: ["We shared the plan with all the stakeholders.", "Chúng tôi đã chia sẻ kế hoạch với tất cả các bên liên quan."], col: ["key stakeholder", "stakeholder meeting"] }
  - { t: requirement, pos: noun, ipa: "/rɪˈkwaɪərmənt/", vi: "yêu cầu", def: "Something the product must do or have.", cat: project-planning, ex: ["The client changed one requirement yesterday.", "Khách hàng đã đổi một yêu cầu hôm qua."], col: ["meet a requirement", "business requirements"] }
  - { t: scope, pos: noun, ipa: "/skoʊp/", vi: "phạm vi (dự án)", def: "The work that is included in a project, and the work that is not.", cat: project-planning, ex: ["That feature is out of scope for this release.", "Tính năng đó nằm ngoài phạm vi của đợt phát hành này."], col: ["out of scope", "change the scope"] }
  - { t: scope creep, pos: noun, ipa: "/ˈskoʊp kriːp/", vi: "phạm vi phình dần", def: "When extra work keeps being added to a project without a new plan or time.", cat: project-planning, ex: ["Scope creep is the reason we are late.", "Phạm vi phình dần là lý do chúng tôi bị trễ."], col: ["avoid scope creep", "risk of scope creep"] }
  - { t: milestone, pos: noun, ipa: "/ˈmaɪlstoʊn/", vi: "cột mốc", def: "An important point in a project that shows real progress.", cat: project-planning, ex: ["We reached the first milestone on Friday.", "Chúng tôi đã đạt cột mốc đầu tiên vào thứ Sáu."], col: ["reach a milestone", "next milestone"] }
  - { t: retrospective, pos: noun, ipa: "/ˌretrəˈspektɪv/", vi: "buổi nhìn lại và rút kinh nghiệm", def: "A team meeting at the end of a sprint to talk about what to improve.", cat: project-planning, ex: ["Let's talk about this in the retrospective.", "Hãy nói về chuyện này trong buổi retrospective."], col: ["sprint retrospective", "run a retrospective"] }
  - { t: demo, pos: noun, ipa: "/ˈdemoʊ/", vi: "buổi trình diễn sản phẩm", def: "A short presentation that shows how a feature works.", cat: project-planning, ex: ["I will give a demo of the new dashboard.", "Tôi sẽ trình diễn bảng theo dõi mới."], col: ["give a demo", "live demo"] }
  - { t: roadmap, pos: noun, ipa: "/ˈroʊdmæp/", vi: "lộ trình sản phẩm", def: "A plan that shows what the team wants to build and roughly when.", cat: project-planning, ex: ["This feature is on the roadmap for next quarter.", "Tính năng này nằm trong lộ trình quý sau."], col: ["product roadmap", "on the roadmap"] }
