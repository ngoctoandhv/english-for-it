  - { t: risk, pos: noun, ipa: "/rɪsk/", vi: "rủi ro", def: "Something that might go wrong and cause a delay or a problem.", cat: project-planning, ex: ["The biggest risk is the late API change.", "Rủi ro lớn nhất là thay đổi API muộn."], col: ["identify a risk", "high risk"] }
