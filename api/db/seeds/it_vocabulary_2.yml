  - { t: YAML, pos: noun, ipa: "/ˈjæməl/", vi: "YAML (định dạng tệp cấu hình)", def: "A simple text format that people use for configuration files.", cat: say-it-right, ex: ["The settings are in a YAML file.", "Các thiết lập nằm trong một tệp YAML."], col: ["YAML file", "YAML syntax"] }
  - { t: Kubernetes, pos: noun, ipa: "/ˌkuːbərˈnetiːz/", vi: "Kubernetes (hệ thống điều phối container)", def: "A system that runs and manages many containers across many servers.", cat: say-it-right, ex: ["We deploy our services to Kubernetes.", "Chúng tôi triển khai các dịch vụ lên Kubernetes."], col: ["Kubernetes cluster", "run on Kubernetes"] }
  - { t: JSON, pos: noun, ipa: "/ˈdʒeɪsɑːn/", vi: "JSON (định dạng dữ liệu)", def: "A common text format for sending data between programs.", cat: say-it-right, ex: ["The API returns the data as JSON.", "API trả dữ liệu dưới dạng JSON."], col: ["JSON response", "parse JSON"] }
  - { t: sudo, pos: noun, ipa: "/ˈsuːduː/", vi: "sudo (chạy lệnh với quyền quản trị)", def: "A command that lets you run another command with administrator rights.", cat: say-it-right, ex: ["You need sudo to install this package.", "Bạn cần sudo để cài gói này."], col: ["run with sudo", "sudo access"] }
