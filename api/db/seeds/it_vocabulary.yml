  - { t: assign, pos: verb, ipa: "/əˈsaɪn/", vi: "giao việc", def: "To give a task to a person.", cat: meetings-email, ex: ["The manager assigned the ticket to Linh.", "Quản lý đã giao ticket cho Linh."], col: ["assign a task", "assign to someone"] }
