  - { t: responsibility, pos: noun, ipa: "/rɪˌspɑːnsəˈbɪləti/", vi: "trách nhiệm, nhiệm vụ", def: "A duty or task that is part of your job.", cat: job-interviews, ex: ["My main responsibility is the backend API.", "Nhiệm vụ chính của tôi là phần API phía backend."], col: ["main responsibility"] }
  - { t: achieve, pos: verb, ipa: "/əˈtʃiːv/", vi: "đạt được", def: "To succeed in doing or getting something after some effort.", cat: job-interviews, ex: ["We achieved our goal in two months.", "Chúng tôi đã đạt mục tiêu trong hai tháng."], col: ["achieve a goal"] }
  - { t: teamwork, pos: noun, ipa: "/ˈtiːmwɜːrk/", vi: "làm việc nhóm", def: "Working together with other people to reach a goal.", cat: job-interviews, ex: ["Good teamwork helped us finish on time.", "Làm việc nhóm tốt giúp chúng tôi hoàn thành đúng hạn."], col: ["good teamwork"] }
  - { t: challenge, pos: noun, ipa: "/ˈtʃælɪndʒ/", vi: "thử thách", def: "Something difficult that needs skill or effort.", cat: job-interviews, ex: ["The biggest challenge was the short deadline.", "Thử thách lớn nhất là hạn chót quá gần."], col: ["face a challenge"] }
  - { t: efficient, pos: adjective, ipa: "/ɪˈfɪʃənt/", vi: "hiệu quả (ít lãng phí)", def: "Working well without wasting time or resources.", cat: describing-comparing, ex: ["This method is more efficient than the old one.", "Cách này hiệu quả hơn cách cũ."], col: ["more efficient than"] }
  - { t: reliable, pos: adjective, ipa: "/rɪˈlaɪəbəl/", vi: "đáng tin cậy", def: "Working well every time, so that you can trust it.", cat: describing-comparing, ex: ["We need a reliable connection for the demo.", "Chúng ta cần một kết nối ổn định cho buổi demo."], col: ["a reliable system"] }
  - { t: scalable, pos: adjective, ipa: "/ˈskeɪləbəl/", vi: "có thể mở rộng", def: "Able to handle more work or more users when it needs to.", cat: describing-comparing, ex: ["A cloud service is more scalable than one small server.", "Dịch vụ đám mây dễ mở rộng hơn một máy chủ nhỏ."], col: ["a scalable solution"] }
  - { t: secure, pos: adjective, ipa: "/sɪˈkjʊr/", vi: "an toàn, bảo mật", def: "Protected from attack or from the loss of data.", cat: describing-comparing, ex: ["The new login page is more secure.", "Trang đăng nhập mới an toàn hơn."], col: ["a secure connection"] }
  - { t: flexible, pos: adjective, ipa: "/ˈfleksəbəl/", vi: "linh hoạt", def: "Easy to change or to adapt to new needs.", cat: describing-comparing, ex: ["This tool is flexible, but it is harder to learn.", "Công cụ này linh hoạt nhưng khó học hơn."], col: ["flexible working hours"] }
  - { t: compare, pos: verb, ipa: "/kəmˈper/", vi: "so sánh", def: "To look at two things to see how they are alike or different.", cat: describing-comparing, ex: ["Let's compare the two options.", "Hãy so sánh hai lựa chọn."], col: ["compare A with B", "compare options"] }
  - { t: advantage, pos: noun, ipa: "/ədˈvæntɪdʒ/", vi: "ưu điểm", def: "Something good that helps one option be better than another.", cat: describing-comparing, ex: ["The main advantage is the lower cost.", "Ưu điểm chính là chi phí thấp hơn."], col: ["a big advantage"] }
  - { t: drawback, pos: noun, ipa: "/ˈdrɔːbæk/", vi: "nhược điểm", def: "A problem that makes something less good.", cat: describing-comparing, ex: ["One drawback is that it needs more maintenance.", "Một nhược điểm là nó cần bảo trì nhiều hơn."], col: ["a major drawback"] }
  - { t: trade-off, pos: noun, ipa: "/ˈtreɪdɔːf/", vi: "sự đánh đổi", def: "A choice in which you must give up one good thing to get another.", cat: describing-comparing, ex: ["There is always a trade-off between speed and cost.", "Luôn có sự đánh đổi giữa tốc độ và chi phí."], col: ["a trade-off between"] }

