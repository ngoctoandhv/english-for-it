words:
  - { t: commit, pos: verb, ipa: "/kəˈmɪt/", vi: "ghi lại (commit) thay đổi", def: "To save a set of changes to a version control repository.", cat: version-control, ex: ["I committed the fix this morning.", "Sáng nay tôi đã commit bản sửa lỗi."], col: ["commit changes", "commit message"] }
  - { t: branch, pos: noun, ipa: "/bræntʃ/", vi: "nhánh", def: "A separate line of development in a repository.", cat: version-control, ex: ["Create a new branch for this feature.", "Hãy tạo một nhánh mới cho tính năng này."], col: ["feature branch", "create a branch"] }
  - { t: merge, pos: verb, ipa: "/mɜːrdʒ/", vi: "gộp (nhánh)", def: "To combine changes from one branch into another.", cat: version-control, ex: ["We will merge the branch after the review.", "Chúng tôi sẽ gộp nhánh sau khi review xong."], col: ["merge a branch", "merge into main"] }
  - { t: pull request, pos: noun, ipa: "/ˈpʊl rɪˌkwest/", vi: "yêu cầu gộp mã (PR)", def: "A request to review and merge your changes into another branch.", cat: version-control, ex: ["I opened a pull request for the login page.", "Tôi đã mở một pull request cho trang đăng nhập."], col: ["open a pull request", "review a pull request"] }
  - { t: conflict, pos: noun, ipa: "/ˈkɑːnflɪkt/", vi: "xung đột (mã)", def: "A situation where two sets of changes cannot be combined automatically.", cat: version-control, ex: ["There is a merge conflict in this file.", "Có một xung đột khi gộp mã trong tệp này."], col: ["merge conflict", "resolve a conflict"] }
  - { t: rebase, pos: verb, ipa: "/ˌriːˈbeɪs/", vi: "rebase (đặt lại nền cho commit)", def: "To move your commits so they start from a different commit.", cat: version-control, ex: ["Please rebase your branch onto main.", "Hãy rebase nhánh của bạn lên main."], col: ["rebase onto main"] }

  - { t: review, pos: noun, ipa: "/rɪˈvjuː/", vi: "đợt xem xét, đánh giá (mã)", def: "A careful check of someone's work to find problems and suggest improvements.", cat: code-review, ex: ["I need a review before I merge.", "Tôi cần một đợt review trước khi gộp mã."], col: ["code review", "request a review"] }
  - { t: approve, pos: verb, ipa: "/əˈpruːv/", vi: "phê duyệt", def: "To officially accept something so that it can move forward.", cat: code-review, ex: ["She approved the pull request.", "Cô ấy đã phê duyệt pull request."], col: ["approve a change"] }
  - { t: feedback, pos: noun, ipa: "/ˈfiːdbæk/", vi: "phản hồi", def: "Comments about how good or useful something is, to help improve it.", cat: code-review, ex: ["Thanks for the feedback. I will update the code.", "Cảm ơn phản hồi của bạn. Tôi sẽ cập nhật mã."], col: ["give feedback", "receive feedback"] }
  - { t: suggestion, pos: noun, ipa: "/səˈdʒestʃən/", vi: "gợi ý", def: "An idea that you offer for someone to think about.", cat: code-review, ex: ["I have a small suggestion about the function name.", "Tôi có một gợi ý nhỏ về tên hàm."], col: ["make a suggestion"] }
  - { t: refactor, pos: verb, ipa: "/ˌriːˈfæktər/", vi: "tái cấu trúc mã", def: "To change the structure of code without changing what it does.", cat: code-review, ex: ["Let's refactor this method to make it shorter.", "Hãy tái cấu trúc phương thức này cho ngắn hơn."], col: ["refactor the code"] }
  - { t: readable, pos: adjective, ipa: "/ˈriːdəbəl/", vi: "dễ đọc", def: "Easy to read and understand.", cat: code-review, ex: ["Short functions are more readable.", "Các hàm ngắn dễ đọc hơn."], col: ["readable code"] }
  - { t: maintainable, pos: adjective, ipa: "/meɪnˈteɪnəbəl/", vi: "dễ bảo trì", def: "Easy to fix, change and improve over time.", cat: code-review, ex: ["We want a maintainable solution, not a quick hack.", "Chúng tôi muốn một giải pháp dễ bảo trì, không phải một cách làm tạm."], col: ["maintainable code"] }

  - { t: bug, pos: noun, ipa: "/bʌɡ/", vi: "lỗi (phần mềm)", def: "A mistake in a program that makes it behave in the wrong way.", cat: debugging, ex: ["I found a bug in the payment form.", "Tôi tìm thấy một lỗi trong biểu mẫu thanh toán."], col: ["fix a bug", "report a bug"] }
  - { t: reproduce, pos: verb, ipa: "/ˌriːprəˈduːs/", vi: "tái hiện (lỗi)", def: "To make a problem happen again in the same way.", cat: debugging, ex: ["I can't reproduce the error on my machine.", "Tôi không thể tái hiện lỗi trên máy của mình."], col: ["reproduce the issue", "steps to reproduce"] }
  - { t: stack trace, pos: noun, ipa: "/ˈstæk treɪs/", vi: "dấu vết ngăn xếp (stack trace)", def: "A list of the function calls that were active when an error happened.", cat: debugging, ex: ["The stack trace shows where the error started.", "Stack trace cho thấy lỗi bắt đầu từ đâu."], col: ["read the stack trace"] }
  - { t: root cause, pos: noun, ipa: "/ˌruːt ˈkɔːz/", vi: "nguyên nhân gốc", def: "The main reason why a problem happens.", cat: debugging, ex: ["We found the root cause of the slow response.", "Chúng tôi đã tìm ra nguyên nhân gốc của việc phản hồi chậm."], col: ["find the root cause"] }
  - { t: workaround, pos: noun, ipa: "/ˈwɜːrkəˌraʊnd/", vi: "giải pháp tạm thời", def: "A temporary way to avoid a problem without fixing it properly.", cat: debugging, ex: ["There is a workaround until we release the fix.", "Có một giải pháp tạm thời cho đến khi chúng tôi phát hành bản sửa."], col: ["a temporary workaround"] }
  - { t: regression, pos: noun, ipa: "/rɪˈɡreʃən/", vi: "lỗi hồi quy", def: "A bug where something that used to work stops working after a change.", cat: debugging, ex: ["This looks like a regression from the last release.", "Có vẻ đây là lỗi hồi quy từ bản phát hành trước."], col: ["regression bug"] }
  - { t: investigate, pos: verb, ipa: "/ɪnˈvestɪɡeɪt/", vi: "điều tra", def: "To look carefully for the reason for a problem.", cat: debugging, ex: ["I'm investigating why the job failed.", "Tôi đang điều tra vì sao tác vụ bị lỗi."], col: ["investigate an issue"] }
  - { t: log, pos: noun, ipa: "/lɔːɡ/", vi: "nhật ký (log)", def: "A record of events that a system writes while it runs.", cat: debugging, ex: ["Check the logs for any errors.", "Hãy kiểm tra log xem có lỗi nào không."], col: ["error log", "check the logs"] }

  - { t: standup, pos: noun, ipa: "/ˈstændʌp/", vi: "họp đứng hằng ngày", def: "A short daily team meeting where everyone shares progress.", cat: agile-standup, ex: ["Our standup starts at nine thirty.", "Buổi standup của chúng tôi bắt đầu lúc chín giờ rưỡi."], col: ["daily standup"] }
  - { t: blocker, pos: noun, ipa: "/ˈblɑːkər/", vi: "vấn đề chặn tiến độ", def: "Something that stops you from continuing your work.", cat: agile-standup, ex: ["My only blocker is access to the test server.", "Vấn đề duy nhất của tôi là chưa có quyền truy cập máy chủ thử nghiệm."], col: ["no blockers"] }
  - { t: sprint, pos: noun, ipa: "/sprɪnt/", vi: "chu kỳ làm việc (sprint)", def: "A short, fixed period of time in which a team completes planned work.", cat: agile-standup, ex: ["We will finish this task in the current sprint.", "Chúng tôi sẽ hoàn thành việc này trong sprint hiện tại."], col: ["sprint planning"] }
  - { t: backlog, pos: noun, ipa: "/ˈbæklɔːɡ/", vi: "danh sách công việc tồn", def: "A list of work that the team plans to do in the future.", cat: agile-standup, ex: ["I added the idea to the backlog.", "Tôi đã thêm ý tưởng đó vào backlog."], col: ["product backlog"] }
  - { t: ticket, pos: noun, ipa: "/ˈtɪkɪt/", vi: "phiếu công việc (ticket)", def: "A record of a task or problem in a tracking system.", cat: agile-standup, ex: ["Please create a ticket for this bug.", "Vui lòng tạo một ticket cho lỗi này."], col: ["create a ticket"] }
  - { t: estimate, pos: verb, ipa: "/ˈestɪmeɪt/", vi: "ước lượng", def: "To say roughly how much time or work something will take.", cat: agile-standup, ex: ["Can you estimate how long this will take?", "Bạn có thể ước lượng việc này mất bao lâu không?"], col: ["estimate the effort"] }
  - { t: priority, pos: noun, ipa: "/praɪˈɔːrəti/", vi: "mức ưu tiên", def: "How important something is compared with other things.", cat: agile-standup, ex: ["Fixing this bug is our top priority.", "Sửa lỗi này là ưu tiên hàng đầu của chúng tôi."], col: ["high priority", "top priority"] }
  - { t: deadline, pos: noun, ipa: "/ˈdedlaɪn/", vi: "hạn chót", def: "The time by which something must be finished.", cat: agile-standup, ex: ["The deadline for this task is Friday.", "Hạn chót của việc này là thứ Sáu."], col: ["meet a deadline", "miss a deadline"] }

  - { t: deploy, pos: verb, ipa: "/dɪˈplɔɪ/", vi: "triển khai", def: "To put software into an environment where it can be used.", cat: deployment, ex: ["We will deploy the new version tonight.", "Chúng tôi sẽ triển khai phiên bản mới vào tối nay."], col: ["deploy to production"] }
  - { t: release, pos: noun, ipa: "/rɪˈliːs/", vi: "bản phát hành", def: "A version of software that is made available to users.", cat: deployment, ex: ["The next release is planned for Monday.", "Bản phát hành tiếp theo dự kiến vào thứ Hai."], col: ["a new release"] }
  - { t: rollback, pos: noun, ipa: "/ˈroʊlbæk/", vi: "quay lui phiên bản", def: "Returning software to an earlier version that worked.", cat: deployment, ex: ["We did a rollback after the deploy failed.", "Chúng tôi đã quay lui phiên bản sau khi triển khai thất bại."], col: ["perform a rollback"] }
  - { t: staging, pos: noun, ipa: "/ˈsteɪdʒɪŋ/", vi: "môi trường staging", def: "A test environment that is very similar to production.", cat: deployment, ex: ["The change is already on staging.", "Thay đổi này đã có trên staging."], col: ["staging environment"] }
  - { t: production, pos: noun, ipa: "/prəˈdʌkʃən/", vi: "môi trường production", def: "The live environment that real users use.", cat: deployment, ex: ["The bug only happens in production.", "Lỗi này chỉ xảy ra trên production."], col: ["in production"] }
  - { t: pipeline, pos: noun, ipa: "/ˈpaɪplaɪn/", vi: "quy trình tự động (pipeline)", def: "An automated series of steps that builds, tests and deploys code.", cat: deployment, ex: ["The pipeline failed at the test step.", "Pipeline bị lỗi ở bước kiểm thử."], col: ["CI/CD pipeline"] }
  - { t: downtime, pos: noun, ipa: "/ˈdaʊntaɪm/", vi: "thời gian ngừng hoạt động", def: "A period when a system is not available.", cat: deployment, ex: ["The update caused ten minutes of downtime.", "Bản cập nhật gây ra mười phút ngừng hoạt động."], col: ["planned downtime"] }

  - { t: clarify, pos: verb, ipa: "/ˈklærəfaɪ/", vi: "làm rõ", def: "To make something easier to understand by explaining it.", cat: communication, ex: ["Can you clarify what you mean by 'soon'?", "Bạn có thể làm rõ ý 'sớm' là khi nào không?"], col: ["clarify the requirements"] }
  - { t: follow up, pos: phrase, ipa: "/ˈfɑːloʊ ʌp/", vi: "theo dõi, hỏi lại sau", def: "To contact someone again or check what happened after an earlier discussion.", cat: communication, ex: ["I will follow up with the client tomorrow.", "Ngày mai tôi sẽ liên hệ lại với khách hàng."], col: ["follow up with someone"] }
  - { t: escalate, pos: verb, ipa: "/ˈeskəleɪt/", vi: "báo lên cấp cao hơn", def: "To pass a problem to someone with more authority.", cat: communication, ex: ["If it is not fixed today, we will escalate it.", "Nếu hôm nay chưa sửa xong, chúng tôi sẽ báo lên cấp trên."], col: ["escalate an issue"] }
  - { t: update, pos: noun, ipa: "/ˈʌpdeɪt/", vi: "bản cập nhật tiến độ", def: "A short message about the latest progress.", cat: communication, ex: ["Here is a quick update on the migration.", "Đây là cập nhật nhanh về việc di chuyển dữ liệu."], col: ["a quick update", "status update"] }

  - { t: laptop, pos: noun, ipa: "/ˈlæptɑːp/", vi: "máy tính xách tay", def: "A small computer that you can carry and use anywhere.", cat: hardware-devices, ex: ["I work on my laptop in the café.", "Tôi làm việc trên laptop ở quán cà phê."], col: ["a work laptop", "laptop battery"] }
  - { t: server, pos: noun, ipa: "/ˈsɜːrvər/", vi: "máy chủ", def: "A computer that provides data or services to other computers.", cat: hardware-devices, ex: ["The server is not responding.", "Máy chủ không phản hồi."], col: ["web server", "restart the server"] }
  - { t: monitor, pos: verb, ipa: "/ˈmɑːnɪtər/", vi: "giám sát", def: "To watch something over time to see if there is a problem.", cat: hardware-devices, ex: ["We monitor the system day and night.", "Chúng tôi giám sát hệ thống cả ngày lẫn đêm."], col: ["monitor the system", "monitor performance"] }
  - { t: storage, pos: noun, ipa: "/ˈstɔːrɪdʒ/", vi: "dung lượng lưu trữ", def: "The space where a device or system keeps data.", cat: hardware-devices, ex: ["We are running out of storage.", "Chúng ta sắp hết dung lượng lưu trữ."], col: ["cloud storage", "storage space"] }
  - { t: memory, pos: noun, ipa: "/ˈmeməri/", vi: "bộ nhớ (RAM)", def: "The fast space a computer uses to hold data while programs are running.", cat: hardware-devices, ex: ["The app uses too much memory.", "Ứng dụng dùng quá nhiều bộ nhớ."], col: ["memory usage", "run out of memory"] }
  - { t: upgrade, lv: a2, pos: verb, ipa: "/ʌpˈɡreɪd/", vi: "nâng cấp", def: "To replace something with a newer or better version.", cat: hardware-devices, ex: ["We need to upgrade the server before the launch.", "Chúng ta cần nâng cấp máy chủ trước khi ra mắt."], col: ["upgrade to a new version"] }
  - { t: device, pos: noun, ipa: "/dɪˈvaɪs/", vi: "thiết bị", def: "A machine made for a particular job, such as a phone or a laptop.", cat: hardware-devices, ex: ["The app works on any device.", "Ứng dụng chạy được trên mọi thiết bị."], col: ["mobile device"] }
  - { t: compatible, lv: b1, pos: adjective, ipa: "/kəmˈpætəbəl/", vi: "tương thích", def: "Able to work together with another system or device.", cat: hardware-devices, ex: ["This tool is compatible with our system.", "Công cụ này tương thích với hệ thống của chúng ta."], col: ["compatible with"] }
  - { t: network, pos: noun, ipa: "/ˈnetwɜːrk/", vi: "mạng", def: "A group of computers and devices that are connected so they can share data.", cat: networking, ex: ["The office network is very slow today.", "Mạng văn phòng hôm nay rất chậm."], col: ["network problem", "wireless network"] }
  - { t: connection, pos: noun, ipa: "/kəˈnekʃən/", vi: "kết nối", def: "A link between two devices or systems that lets them share data.", cat: networking, ex: ["I lost my internet connection.", "Tôi bị mất kết nối internet."], col: ["internet connection", "lose the connection"] }
  - { t: bandwidth, pos: noun, ipa: "/ˈbændwɪdθ/", vi: "băng thông", def: "The amount of data that can be sent over a connection in a given time.", cat: networking, ex: ["Video calls need a lot of bandwidth.", "Cuộc gọi video cần nhiều băng thông."], col: ["limited bandwidth"] }
  - { t: latency, pos: noun, ipa: "/ˈleɪtənsi/", vi: "độ trễ", def: "The time that data takes to travel from one point to another.", cat: networking, ex: ["High latency makes video calls lag.", "Độ trễ cao làm cuộc gọi video bị giật."], col: ["high latency", "reduce latency"] }
  - { t: firewall, pos: noun, ipa: "/ˈfaɪərwɔːl/", vi: "tường lửa", def: "A security system that controls which network traffic is allowed in and out.", cat: networking, ex: ["The firewall blocked the connection.", "Tường lửa đã chặn kết nối."], col: ["firewall rule"] }
  - { t: request, pos: noun, ipa: "/rɪˈkwest/", vi: "yêu cầu (gửi tới máy chủ)", def: "A message sent to a server to ask for data or for an action.", cat: networking, ex: ["The server received too many requests.", "Máy chủ nhận quá nhiều yêu cầu."], col: ["send a request", "API request"] }
  - { t: response, pos: noun, ipa: "/rɪˈspɑːns/", vi: "phản hồi (từ máy chủ)", def: "The answer that a server sends back after a request.", cat: networking, ex: ["The response took five seconds.", "Phản hồi mất năm giây."], col: ["response time"] }
  - { t: timeout, pos: noun, ipa: "/ˈtaɪmaʊt/", vi: "hết thời gian chờ", def: "An error that happens when something takes too long to respond.", cat: networking, ex: ["The page showed a timeout error.", "Trang hiển thị lỗi hết thời gian chờ."], col: ["timeout error"] }
  - { t: password, pos: noun, ipa: "/ˈpæswɜːrd/", vi: "mật khẩu", def: "A secret word or phrase that you use to log in to a system.", cat: security, ex: ["Please use a long and unique password.", "Hãy dùng mật khẩu dài và không trùng với nơi khác."], col: ["reset a password", "strong password"] }
  - { t: authentication, pos: noun, ipa: "/ɔːˌθentɪˈkeɪʃən/", vi: "xác thực", def: "The process of proving who you are before you can use a system.", cat: security, ex: ["We use two-factor authentication for all accounts.", "Chúng tôi dùng xác thực hai yếu tố cho mọi tài khoản."], col: ["two-factor authentication"] }
  - { t: permission, pos: noun, ipa: "/pərˈmɪʃən/", vi: "quyền truy cập, sự cho phép", def: "Official approval to access or change something.", cat: security, ex: ["I don't have permission to open this folder.", "Tôi không có quyền mở thư mục này."], col: ["ask for permission", "permission error"] }
  - { t: encrypt, pos: verb, ipa: "/ɪnˈkrɪpt/", vi: "mã hóa", def: "To change data into a secret code so that other people cannot read it.", cat: security, ex: ["All customer data is encrypted.", "Mọi dữ liệu khách hàng đều được mã hóa."], col: ["encrypt data"] }
  - { t: vulnerability, pos: noun, ipa: "/ˌvʌlnərəˈbɪləti/", vi: "lỗ hổng bảo mật", def: "A weakness in a system that an attacker could use.", cat: security, ex: ["The team found a serious vulnerability.", "Nhóm đã phát hiện một lỗ hổng bảo mật nghiêm trọng."], col: ["security vulnerability"] }
  - { t: breach, pos: noun, ipa: "/briːtʃ/", vi: "vụ xâm phạm dữ liệu", def: "An event where someone gets into a system or data without permission.", cat: security, ex: ["The company reported a data breach.", "Công ty đã báo cáo một vụ xâm phạm dữ liệu."], col: ["data breach"] }
  - { t: patch, pos: noun, ipa: "/pætʃ/", vi: "bản vá", def: "A small update that fixes a problem or a security weakness.", cat: security, ex: ["We installed the security patch last night.", "Tối qua chúng tôi đã cài bản vá bảo mật."], col: ["security patch", "apply a patch"] }
  - { t: cloud, pos: noun, ipa: "/klaʊd/", vi: "điện toán đám mây", def: "Computers and services that you use over the internet instead of on your own machine.", cat: cloud-infrastructure, ex: ["Our application runs in the cloud.", "Ứng dụng của chúng tôi chạy trên đám mây."], col: ["cloud service", "in the cloud"] }
  - { t: container, pos: noun, ipa: "/kənˈteɪnər/", vi: "container (gói chạy ứng dụng)", def: "A package that holds an app and everything it needs to run.", cat: cloud-infrastructure, ex: ["We run each service in its own container.", "Chúng tôi chạy mỗi dịch vụ trong một container riêng."], col: ["Docker container"] }
  - { t: scale, pos: verb, ipa: "/skeɪl/", vi: "mở rộng quy mô", def: "To change the size or power of a system so that it can handle more or less work.", cat: cloud-infrastructure, ex: ["The system must scale when more users arrive.", "Hệ thống phải mở rộng được khi có thêm người dùng."], col: ["scale up", "scale the system"] }
  - { t: backup, pos: noun, ipa: "/ˈbækʌp/", vi: "bản sao lưu", def: "A copy of data that you keep in case the original is lost.", cat: cloud-infrastructure, ex: ["Always make a backup before the migration.", "Luôn tạo bản sao lưu trước khi di chuyển dữ liệu."], col: ["make a backup", "daily backup"] }
  - { t: outage, pos: noun, ipa: "/ˈaʊtɪdʒ/", vi: "sự cố ngừng dịch vụ", def: "A period when a service does not work.", cat: cloud-infrastructure, ex: ["The outage lasted about an hour.", "Sự cố ngừng dịch vụ kéo dài khoảng một giờ."], col: ["a service outage"] }
  - { t: uptime, pos: noun, ipa: "/ˈʌptaɪm/", vi: "thời gian hoạt động", def: "The time that a system is working and available.", cat: cloud-infrastructure, ex: ["Our uptime was 99.9 percent last month.", "Thời gian hoạt động của chúng tôi tháng trước là 99,9 phần trăm."], col: ["high uptime"] }
  - { t: environment, pos: noun, ipa: "/ɪnˈvaɪrənmənt/", vi: "môi trường (dev, staging, production)", def: "A place where software runs, such as development, staging or production.", cat: cloud-infrastructure, ex: ["Please test it in the staging environment first.", "Hãy thử nó trên môi trường staging trước."], col: ["test environment", "production environment"] }
  - { t: database, pos: noun, ipa: "/ˈdeɪtəbeɪs/", vi: "cơ sở dữ liệu", def: "An organized collection of data that is stored on a computer.", cat: data-databases, ex: ["The database stores all customer orders.", "Cơ sở dữ liệu lưu mọi đơn hàng của khách."], col: ["database server", "connect to the database"] }
  - { t: query, pos: noun, ipa: "/ˈkwɪri/", vi: "truy vấn", def: "A request for information from a database.", cat: data-databases, ex: ["This query is very slow.", "Truy vấn này rất chậm."], col: ["run a query", "slow query"] }
  - { t: record, pos: noun, ipa: "/ˈrekərd/", vi: "bản ghi", def: "One entry of information in a database.", cat: data-databases, ex: ["Each customer has one record in the table.", "Mỗi khách hàng có một bản ghi trong bảng."], col: ["create a record", "delete a record"] }
  - { t: migration, pos: noun, ipa: "/maɪˈɡreɪʃən/", vi: "di chuyển dữ liệu, migration", def: "The process of moving data or changing the structure of a database.", cat: data-databases, ex: ["The migration will run tonight.", "Migration sẽ chạy vào tối nay."], col: ["database migration", "run a migration"] }
  - { t: duplicate, pos: noun, ipa: "/ˈduːplɪkət/", vi: "bản trùng lặp", def: "An exact copy of something.", cat: data-databases, ex: ["We found many duplicates in the customer list.", "Chúng tôi tìm thấy nhiều bản trùng trong danh sách khách hàng."], col: ["remove duplicates"] }
  - { t: validate, pos: verb, ipa: "/ˈvælɪdeɪt/", vi: "kiểm tra tính hợp lệ", def: "To check that data or input is correct and follows the rules.", cat: data-databases, ex: ["The form validates the email address.", "Biểu mẫu kiểm tra tính hợp lệ của địa chỉ email."], col: ["validate input", "validate data"] }
  - { t: performance, pos: noun, ipa: "/pərˈfɔːrməns/", vi: "hiệu năng", def: "How fast and how well a system works.", cat: data-databases, ex: ["We improved the performance of the search page.", "Chúng tôi đã cải thiện hiệu năng của trang tìm kiếm."], col: ["performance issue", "improve performance"] }
  - { t: agenda, pos: noun, ipa: "/əˈdʒendə/", vi: "chương trình họp", def: "A list of the topics to talk about in a meeting.", cat: meetings-email, ex: ["I will send the agenda before the meeting.", "Tôi sẽ gửi chương trình họp trước cuộc họp."], col: ["meeting agenda", "on the agenda"] }
  - { t: action item, pos: noun, ipa: "/ˈækʃən ˌaɪtəm/", vi: "việc cần làm sau họp", def: "A task that someone agrees to do after a meeting.", cat: meetings-email, ex: ["Each action item has an owner and a date.", "Mỗi việc cần làm có một người phụ trách và một ngày."], col: ["assign an action item"] }
  - { t: schedule, pos: verb, ipa: "/ˈskedʒuːl/", vi: "lên lịch", def: "To plan a time for something to happen.", cat: meetings-email, ex: ["Can we schedule a call for tomorrow?", "Chúng ta có thể lên lịch một cuộc gọi vào ngày mai không?"], col: ["schedule a meeting"] }
  - { t: attach, pos: verb, ipa: "/əˈtætʃ/", vi: "đính kèm", def: "To add a file to an email or a message.", cat: meetings-email, ex: ["I attached the report to this email.", "Tôi đã đính kèm báo cáo vào email này."], col: ["attach a file"] }
  - { t: reminder, pos: noun, ipa: "/rɪˈmaɪndər/", vi: "lời nhắc", def: "A message that helps you remember something.", cat: meetings-email, ex: ["This is a friendly reminder about Friday's deadline.", "Đây là lời nhắc thân thiện về hạn chót ngày thứ Sáu."], col: ["a friendly reminder", "set a reminder"] }
