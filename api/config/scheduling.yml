# Review scheduling parameters. Tune here; no code change needed.
default: &default
  algorithm: simple          # replaceable: register another algorithm in Scheduling.algorithm
  initial_ease: 2.5
  min_ease: 1.3
  max_interval_days: 365
  again_minutes: 10          # a forgotten card comes back after this many minutes
  first_interval_days:       # interval after the first successful review of a new/lapsed card
    hard: 1
    good: 1
    easy: 4
  hard_multiplier: 1.2
  easy_bonus: 1.3
  ease_delta:
    again: -0.2
    hard: -0.15
    good: 0.0
    easy: 0.15

development:
  <<: *default
test:
  <<: *default
production:
  <<: *default
